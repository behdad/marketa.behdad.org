<svg xmlns="http://www.w3.org/2000/svg" width="192" height="100" viewBox="0 0 192 100" shape-rendering="crispEdges">
  <!-- PrinceJS dungeon-atlas palette: the surround should read as the same wall,
       rather than as a decorative frame around it. -->
  <rect width="192" height="100" fill="#1c304c"/>
