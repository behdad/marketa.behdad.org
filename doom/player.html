<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom — FreeDM</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
#canvas{grid-area:1/1;display:block;width:min(100vw,133.333vh)!important;height:auto!important;max-width:100vw!important;max-height:100vh!important;aspect-ratio:4/3!important;background:#000;outline:0;image-rendering:pixelated}
#status{grid-area:1/1;z-index:1;margin:0;padding:0 4px;color:#e8c060;text-align:center;font:11px/1.3 ui-monospace,monospace;pointer-events:none}
#status.err{color:#e0736a}
#status:empty{display:none}
#touch-pad{display:none;position:fixed;z-index:4;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));grid-template-columns:repeat(3,clamp(42px,7vw,68px));grid-template-areas:". w ." "a s d";gap:clamp(4px,1vw,10px);padding:5px;border:1px solid rgba(255,255,255,.24);border-radius:14px;background:rgba(12,12,12,.62);touch-action:none;pointer-events:none;user-select:none;-webkit-user-select:none}
#touch-pad[hidden]{display:none}
#touch-pad button{grid-area:var(--touch-grid);pointer-events:auto;min-width:0;aspect-ratio:1;border:1px solid rgba(255,255,255,.34);border-radius:10px;background:rgba(55,55,55,.78);color:#fff;font:700 clamp(16px,3vw,25px)/1 system-ui,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch-pad button:active,#touch-pad button[aria-pressed="true"]{background:rgba(180,110,42,.92);border-color:#f5d28a}
#touch-pad [data-touch-key="w"]{--touch-grid:w}#touch-pad [data-touch-key="a"]{--touch-grid:a}#touch-pad [data-touch-key="s"]{--touch-grid:s}#touch-pad [data-touch-key="d"]{--touch-grid:d}
@media (any-pointer:coarse) and (min-width:600px),(hover:none) and (min-width:600px){#touch-pad{display:grid}}
</style>
</head>
<body>
<canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
<nav id="touch-pad" aria-label="Touch movement controls" hidden>
  <button type="button" data-touch-key="w" aria-label="Move forward" aria-pressed="false">W</button>
  <button type="button" data-touch-key="a" aria-label="Move left" aria-pressed="false">A</button>
  <button type="button" data-touch-key="s" aria-label="Move backward" aria-pressed="false">S</button>
  <button type="button" data-touch-key="d" aria-label="Move right" aria-pressed="false">D</button>
</nav>
<p id="status">Loading Doom…</p>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("canvas");
  var status = document.getElementById("status");
  var parentActive = false;
  var ready = false;
  var paused = true;
  var stallTimer = 0;
  var touchPad = document.getElementById("touch-pad");
  var touchPointers = Object.create(null);
  var touchKeyCounts = Object.create(null);

  function emitTouchKey(type, key) {
    var upper = key.toUpperCase(), code = "Key" + upper, keyCode = upper.charCodeAt(0);
    canvas.dispatchEvent(new KeyboardEvent(type, { key: key, code: code, keyCode: keyCode, which: keyCode, bubbles: true, cancelable: true }));
  }
  function setTouchKey(key, down) {
    var count = touchKeyCounts[key] || 0;
    if (down) {
      touchKeyCounts[key] = count + 1;
      if (!count) emitTouchKey("keydown", key);
    } else if (count) {
      touchKeyCounts[key] = count - 1;
      if (count === 1) emitTouchKey("keyup", key);
    }
    var button = touchPad && touchPad.querySelector('[data-touch-key="' + key + '"]');
    if (button) button.setAttribute("aria-pressed", (touchKeyCounts[key] || 0) > 0 ? "true" : "false");
  }
  function releaseTouchPointer(pointerId) {
    var key = touchPointers[pointerId];
    if (!key) return;
    delete touchPointers[pointerId];
    setTouchKey(key, false);
  }
  function releaseTouchKeys() { Object.keys(touchPointers).forEach(releaseTouchPointer); }
  if (touchPad) {
    touchPad.addEventListener("pointerdown", function (event) {
      var button = event.target.closest && event.target.closest("[data-touch-key]");
      if (!button) return;
      event.preventDefault();
      var pointerId = String(event.pointerId), key = button.getAttribute("data-touch-key");
      if (touchPointers[pointerId]) return;
      touchPointers[pointerId] = key;
      try { button.setPointerCapture(event.pointerId); } catch (_) {}
      setTouchKey(key, true);
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (type) {
      touchPad.addEventListener(type, function (event) { releaseTouchPointer(String(event.pointerId)); });
    });
    touchPad.addEventListener("click", function (event) { event.preventDefault(); });
    touchPad.addEventListener("contextmenu", function (event) { event.preventDefault(); });
  }

  function tell(state) {
    try { parent.postMessage({ kind: "shoot-status", game: "doom", state: state }, location.origin); } catch (_) {}
  }
  function setStatus(text, isError) {
    status.textContent = text || "";
    status.className = isError ? "err" : "";
  }
  function shouldRun() {
    return parentActive && !document.hidden;
  }
  function sync() {
    if (!ready || !window.Module) return;
    var run = shouldRun();
    if (run && paused) {
      try { Module.resumeMainLoop(); } catch (_) {}
      paused = false;
    } else if (!run && !paused) {
      try { Module.pauseMainLoop(); } catch (_) {}
      paused = true;
    }
  }
  function fail() {
    if (stallTimer) clearTimeout(stallTimer);
    setStatus("Doom is offline.", true);
    tell("failed");
  }

  addEventListener("message", function (event) {
    if (event.origin !== location.origin || !event.data || event.data.kind !== "shoot-control") return;
    parentActive = !!event.data.active;
    if (!parentActive) releaseTouchKeys();
    sync();
  });
  addEventListener("focus", sync);
  addEventListener("blur", sync);
  document.addEventListener("visibilitychange", sync);
  window.addEventListener("blur", releaseTouchKeys);
  document.addEventListener("pointerdown", function () {
    try { window.focus(); } catch (_) {}
    try { canvas.focus({ preventScroll: true }); } catch (_) {}
    sync();
  });
  document.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    try { parent.postMessage({ kind: "shoot-contextmenu", game: "doom", x: event.clientX / innerWidth, y: event.clientY / innerHeight }, location.origin); } catch (e) {}
  });
  document.addEventListener("pointerlockchange", function () {
    if (!document.pointerLockElement) return;
    try { parent.postMessage({ kind: "shoot-pointer-lock", game: "doom" }, location.origin); } catch (e) {}
  });
  document.addEventListener("keydown", function (event) {
    if (event.ctrlKey || event.metaKey || event.altKey) event.stopImmediatePropagation();
  }, true);

  window.Module = {
    arguments: [
      "-iwad", "freedm.wad",
      "-window", "-nogui", "-nosound", "-nomusic",
      "-config", "default.cfg", "-extraconfig", "extra.cfg"
    ],
    noInitialRun: true,
    locateFile: function (path) {
      return path === "websockets-doom.wasm" ? "./doom.wasm" : path;
    },
    preRun: [function () {
      Module.FS.createPreloadedFile("", "freedm.wad", "./freedm.wad", true, true);
      Module.FS.createPreloadedFile("", "default.cfg", "./default.cfg", true, true);
      Module.FS.createPreloadedFile("", "extra.cfg", "./extra.cfg", true, true);
    }],
    canvas: canvas,
    onRuntimeInitialized: function () {
      if (stallTimer) clearTimeout(stallTimer);
      try {
        (Module.callMain || window.callMain)(Module.arguments);
        ready = true;
        touchPad.hidden = false;
        paused = false;
        setStatus("");
        tell("ready");
        try { canvas.focus({ preventScroll: true }); } catch (_) {}
        sync();
      } catch (error) {
        console.error(error);
        fail();
      }
    },
    onAbort: fail,
    print: function () {},
    printErr: function () {},
    setStatus: function () {}
  };

  stallTimer = setTimeout(fail, 60000);
  var script = document.createElement("script");
  script.src = "./doom.js";
  script.onerror = fail;
  document.body.appendChild(script);
})();
</script>
</body>
</html>
