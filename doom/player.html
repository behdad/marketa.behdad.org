<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom — FreeDM</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
#canvas{grid-area:1/1;display:block;width:min(100vw,133.333vh)!important;height:auto!important;max-width:100vw!important;max-height:100vh!important;aspect-ratio:4/3!important;background:#000;outline:0;image-rendering:pixelated}
#status{grid-area:1/1;z-index:1;margin:0;padding:0 4px;color:#e8c060;text-align:center;font:11px/1.3 ui-monospace,monospace;pointer-events:none}
#status.err{color:#e0736a}
#status:empty{display:none}
#touch-pad{--touch-cell:clamp(25px,16.6vmin,76px);display:none;position:fixed;z-index:4;left:max(0px,env(safe-area-inset-left));bottom:max(clamp(5px,2vmin,14px),env(safe-area-inset-bottom));grid-template:repeat(3,var(--touch-cell))/repeat(3,var(--touch-cell));justify-content:center;gap:clamp(2px,1.4vmin,8px);border-radius:clamp(5px,3vmin,16px);touch-action:none;cursor:grab;background:linear-gradient(90deg,transparent 31%,rgba(65,100,255,.28) 31% 69%,transparent 69%),linear-gradient(transparent 31%,rgba(65,100,255,.28) 31% 69%,transparent 69%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#touch-pad[hidden]{display:none}
#touch-pad::before{content:"";grid-area:2/2;width:53.333%;height:53.333%;place-self:center;border:clamp(.45px,.12vmin,1px) solid #6579dc;border-radius:50%;background:#253fc8;box-shadow:0 0 clamp(1px,.25vmin,1.5px) rgba(65,100,255,.75);pointer-events:none}
#touch-pad.dragging{cursor:grabbing}
#touch-pad.dragging::before{background:#ffd83d;border-color:#f5d7a1;box-shadow:0 0 clamp(1.5px,.35vmin,2.5px) rgba(255,216,61,.85)}
#touch-pad button{box-sizing:border-box;min-width:0;padding:0;border:0;border-radius:clamp(3px,2vmin,10px);background:#182252;color:#f8f5ec;font:700 clamp(10px,7.5vmin,32px)/1 ui-monospace,monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch-pad [data-dir="up left"]{grid-area:1/1}#touch-pad [data-dir=up]{grid-area:1/2}#touch-pad [data-dir="up right"]{grid-area:1/3}#touch-pad [data-dir=left]{grid-area:2/1}#touch-pad [data-dir=right]{grid-area:2/3}#touch-pad [data-dir="down left"]{grid-area:3/1}#touch-pad [data-dir=down]{grid-area:3/2}#touch-pad [data-dir="down right"]{grid-area:3/3}
@media (any-pointer:coarse),(hover:none){#touch-pad{display:grid}}
</style>
</head>
<body>
<canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
<nav id="touch-pad" aria-label="Touch movement controls" hidden>
  <button type="button" class="touch-pad-button" data-dir="up left" aria-label="Move forward and left" aria-pressed="false">↖</button>
  <button type="button" class="touch-pad-button" data-dir="up" data-touch-key="w" aria-label="Move forward" aria-pressed="false">↑</button>
  <button type="button" class="touch-pad-button" data-dir="up right" aria-label="Move forward and right" aria-pressed="false">↗</button>
  <button type="button" class="touch-pad-button" data-dir="left" data-touch-key="a" aria-label="Move left" aria-pressed="false">←</button>
  <button type="button" class="touch-pad-button" data-dir="right" data-touch-key="d" aria-label="Move right" aria-pressed="false">→</button>
  <button type="button" class="touch-pad-button" data-dir="down left" aria-label="Move backward and left" aria-pressed="false">↙</button>
  <button type="button" class="touch-pad-button" data-dir="down" data-touch-key="s" aria-label="Move backward" aria-pressed="false">↓</button>
  <button type="button" class="touch-pad-button" data-dir="down right" aria-label="Move backward and right" aria-pressed="false">↘</button>
</nav>
<p id="status">Loading Doom…</p>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("canvas");
  var status = document.getElementById("status");
  var parentActive = false;
  var ready = false;
  var paused = true;
  var stallTimer = 0;
  var engineMousemoveHandlers = [];
  var engineKeyboardHandlers = { keydown: [], keyup: [] };
  var touchPad = document.getElementById("touch-pad");
  var touchDrag = null;
  var touchHeldKeys = [];
  var touchDirectionKeys = { up: "w", left: "a", right: "d", down: "s" };
  var touchReverse = { up: "down", down: "up", left: "right", right: "left" };

  function emitTouchKey(type, key) {
    var upper = key.toUpperCase(), code = "Key" + upper, keyCode = upper.charCodeAt(0);
    var event = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true });
    try { Object.defineProperty(event, "keyCode", { value: keyCode }); } catch (_) {}
    try { Object.defineProperty(event, "which", { value: keyCode }); } catch (_) {}
    var handlers = engineKeyboardHandlers[type];
    if (handlers && handlers.length) handlers.forEach(function (entry) {
      try {
        if (typeof entry.listener === "function") entry.listener.call(entry.target, event);
        else if (entry.listener && entry.listener.handleEvent) entry.listener.handleEvent(event);
      } catch (error) { console.error(error); }
    });
    else canvas.dispatchEvent(event);
  }
  function setTouchDirection(direction) {
    var keys = direction ? direction.split(" ").map(function (part) { return touchDirectionKeys[part]; }).filter(Boolean) : [];
    touchHeldKeys.filter(function (key) { return keys.indexOf(key) < 0; }).forEach(function (key) { emitTouchKey("keyup", key); });
    keys.filter(function (key) { return touchHeldKeys.indexOf(key) < 0; }).forEach(function (key) { emitTouchKey("keydown", key); });
    touchHeldKeys = keys;
    var buttons = touchPad ? touchPad.querySelectorAll("[data-dir]") : [];
    for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute("data-dir") === direction ? "true" : "false");
  }
  function releaseTouchKeys() {
    var pointerId = touchDrag && touchDrag.pointerId;
    touchDrag = null;
    if (touchPad) touchPad.classList.remove("dragging");
    setTouchDirection("");
    if (pointerId != null && touchPad) { try { touchPad.releasePointerCapture(pointerId); } catch (_) {} }
  }
  if (touchPad) {
    function endTouchDrag(event) {
      if (!touchDrag || (event && event.pointerId !== touchDrag.pointerId)) return;
      if (event) { event.preventDefault(); event.stopPropagation(); }
      releaseTouchKeys();
    }
    touchPad.addEventListener("pointerdown", function (event) {
      if ((event.button !== undefined && event.button !== 0) || touchDrag) return;
      event.preventDefault(); event.stopPropagation();
      try { parent.postMessage({ kind:"shoot-touch-control", game:"doom" }, location.origin); } catch (_) {}
      var button = event.target.closest && event.target.closest("[data-dir]");
      var rect = touchPad.getBoundingClientRect();
      touchDrag = {
        pointerId: event.pointerId, x: event.clientX, y: event.clientY,
        lastDir: button ? button.getAttribute("data-dir") : null,
        threshold: Math.max(3, Math.min(7, Math.min(rect.width, rect.height) * .16))
      };
      touchPad.classList.add("dragging");
      try { touchPad.setPointerCapture(event.pointerId); } catch (_) {}
      if (touchDrag.lastDir) setTouchDirection(touchDrag.lastDir);
    });
    // Match Hack-Man's live direction pad: re-anchor after turns and require extra travel to reverse.
    touchPad.addEventListener("pointermove", function (event) {
      if (!touchDrag || event.pointerId !== touchDrag.pointerId) return;
      event.preventDefault(); event.stopPropagation();
      var dx = event.clientX - touchDrag.x, dy = event.clientY - touchDrag.y;
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < touchDrag.threshold) return;
      var diagonal = ax >= touchDrag.threshold && ay >= touchDrag.threshold && Math.max(ax, ay) < Math.min(ax, ay) * 1.8;
      var direction = diagonal ? (dy > 0 ? "down" : "up") + " " + (dx > 0 ? "right" : "left") : ax > ay ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      var needed = touchDrag.lastDir && touchReverse[touchDrag.lastDir] === direction ? touchDrag.threshold * 1.55 : touchDrag.threshold;
      if (Math.max(ax, ay) < needed) return;
      touchDrag.x = event.clientX; touchDrag.y = event.clientY;
      if (direction === touchDrag.lastDir) return;
      touchDrag.lastDir = direction;
      setTouchDirection(direction);
    });
    touchPad.addEventListener("pointerup", endTouchDrag);
    touchPad.addEventListener("pointercancel", endTouchDrag);
    touchPad.addEventListener("lostpointercapture", endTouchDrag);
    touchPad.addEventListener("click", function (event) { event.preventDefault(); });
    ["contextmenu", "selectstart", "dragstart"].forEach(function (type) {
      touchPad.addEventListener(type, function (event) { event.preventDefault(); event.stopPropagation(); });
    });
  }

  function tell(state) {
    try { parent.postMessage({ kind: "shoot-status", game: "doom", state: state }, location.origin); } catch (_) {}
  }
  function setStatus(text, isError) {
    status.textContent = text || "";
    status.className = isError ? "err" : "";
  }
  function shouldRun() {
    return parentActive && !document.hidden;
  }
  function sync() {
    if (!ready || !window.Module) return;
    var run = shouldRun();
    if (run && paused) {
      try { Module.resumeMainLoop(); } catch (_) {}
      paused = false;
    } else if (!run && !paused) {
      try { Module.pauseMainLoop(); } catch (_) {}
      paused = true;
    }
  }
  function fail() {
    if (stallTimer) clearTimeout(stallTimer);
    setStatus("Doom is offline.", true);
    tell("failed");
  }

  addEventListener("message", function (event) {
    if (event.origin !== location.origin || !event.data || event.data.kind !== "shoot-control") return;
    parentActive = !!event.data.active;
    if (!parentActive) releaseTouchKeys();
    sync();
  });
  addEventListener("focus", sync);
  addEventListener("blur", sync);
  document.addEventListener("visibilitychange", sync);
  window.addEventListener("blur", releaseTouchKeys);
  document.addEventListener("pointerdown", function () {
    try { window.focus(); } catch (_) {}
    try { canvas.focus({ preventScroll: true }); } catch (_) {}
    sync();
  });
  var touchAim = null;
  window.addEventListener("pointerdown", function (event) {
    if (event.pointerType !== "touch" || event.target !== canvas) return;
    event.preventDefault(); event.stopImmediatePropagation();
    touchAim = { id:event.pointerId, x:event.clientX, y:event.clientY, sx:event.clientX, sy:event.clientY, moved:false };
    try { canvas.setPointerCapture(event.pointerId); } catch (e) {}
  }, true);
  window.addEventListener("pointermove", function (event) {
    if (!touchAim || event.pointerId !== touchAim.id) return;
    event.preventDefault(); event.stopImmediatePropagation();
    var dx = event.clientX - touchAim.x, dy = event.clientY - touchAim.y;
    if (Math.hypot(event.clientX - touchAim.sx, event.clientY - touchAim.sy) > 5) touchAim.moved = true;
    touchAim.x = event.clientX; touchAim.y = event.clientY;
    var mouseMove = new MouseEvent("mousemove", {
      bubbles:true, cancelable:true, clientX:event.clientX, clientY:event.clientY
    });
    try { Object.defineProperty(mouseMove, "movementX", { value:dx * 12 }); } catch (_) {}
    try { Object.defineProperty(mouseMove, "movementY", { value:dy * 12 }); } catch (_) {}
    if (engineMousemoveHandlers.length) engineMousemoveHandlers.forEach(function (entry) {
      try {
        if (typeof entry.listener === "function") entry.listener.call(entry.target, mouseMove);
        else if (entry.listener && entry.listener.handleEvent) entry.listener.handleEvent(mouseMove);
      } catch (error) { console.error(error); }
    });
    else canvas.dispatchEvent(mouseMove);
  }, true);
  function finishTouchAim(event) {
    if (!touchAim || event.pointerId !== touchAim.id) return;
    event.preventDefault(); event.stopImmediatePropagation();
    if (!touchAim.moved) {
      canvas.dispatchEvent(new MouseEvent("mousedown", { bubbles:true, button:0, buttons:1 }));
      canvas.dispatchEvent(new MouseEvent("mouseup", { bubbles:true, button:0 }));
    }
    touchAim = null;
  }
  window.addEventListener("pointerup", finishTouchAim, true);
  window.addEventListener("pointercancel", finishTouchAim, true);
  document.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    try { parent.postMessage({ kind: "shoot-contextmenu", game: "doom", x: event.clientX / innerWidth, y: event.clientY / innerHeight }, location.origin); } catch (e) {}
  });
  document.addEventListener("pointerlockchange", function () {
    if (!document.pointerLockElement) return;
    try { parent.postMessage({ kind: "shoot-pointer-lock", game: "doom" }, location.origin); } catch (e) {}
  });
  document.addEventListener("keydown", function (event) {
    if (event.ctrlKey || event.metaKey || event.altKey) event.stopImmediatePropagation();
  }, true);

  window.Module = {
    arguments: [
      "-iwad", "freedm.wad",
      "-window", "-nogui", "-nosound", "-nomusic",
      "-config", "default.cfg", "-extraconfig", "extra.cfg"
    ],
    noInitialRun: true,
    locateFile: function (path) {
      return path === "websockets-doom.wasm" ? "./doom.wasm" : path;
    },
    preRun: [function () {
      Module.FS.createPreloadedFile("", "freedm.wad", "./freedm.wad", true, true);
      Module.FS.createPreloadedFile("", "default.cfg", "./default.cfg", true, true);
      Module.FS.createPreloadedFile("", "extra.cfg", "./extra.cfg", true, true);
    }],
    canvas: canvas,
    onRuntimeInitialized: function () {
      if (stallTimer) clearTimeout(stallTimer);
      try {
        (Module.callMain || window.callMain)(Module.arguments);
        ready = true;
        touchPad.hidden = false;
        paused = false;
        setStatus("");
        tell("ready");
        try { canvas.focus({ preventScroll: true }); } catch (_) {}
        sync();
      } catch (error) {
        console.error(error);
        fail();
      }
    },
    onAbort: fail,
    print: function () {},
    printErr: function () {},
    setStatus: function () {}
  };

  stallTimer = setTimeout(fail, 60000);
  var nativeAddEventListener = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function (type, listener, options) {
    if (type === "mousemove" && listener && (this === document || this === window || this === canvas)) {
      engineMousemoveHandlers.push({ target:this, listener:listener });
    }
    if ((type === "keydown" || type === "keyup") && listener &&
        (this === document || this === window || this === canvas)) {
      engineKeyboardHandlers[type].push({ target:this, listener:listener });
    }
    return nativeAddEventListener.call(this, type, listener, options);
  };
  var script = document.createElement("script");
  script.src = "./doom.js";
  script.onerror = fail;
  document.body.appendChild(script);
})();
</script>
</body>
</html>
