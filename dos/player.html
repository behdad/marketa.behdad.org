<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>snake</title>
<link rel="stylesheet" href="runtime/js-dos.css">
<style>
html,body,#dos{width:100%;height:100%;margin:0;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent}
body{font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none}
#dos{position:relative}
#status{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:clamp(2px,3vmin,.5rem);box-sizing:border-box;background:radial-gradient(circle at 50% 42%,#101b47 0,#05091e 48%,#000 100%);color:#fff3a6;text-align:center;line-height:1.15;opacity:1;transition:opacity 70ms ease;pointer-events:none}
#status[hidden]{display:none}
.status-card{display:grid;justify-items:center;gap:clamp(2px,2vh,.55rem);box-sizing:border-box;width:min(17rem,92vw);padding:clamp(3px,4vh,1rem) clamp(4px,4vw,1.2rem);border:1px solid rgba(133,157,255,.36);border-radius:clamp(3px,2vmin,.7rem);background:rgba(4,8,27,.72);box-shadow:0 clamp(2px,3vh,1rem) clamp(8px,10vh,3rem) rgba(0,0,0,.5)}
.status-title{font-size:clamp(7px,min(7vw,18vh),1.55rem);line-height:1.05;letter-spacing:.18em;color:#fff8b8;text-shadow:.12em .12em 0 #253b9c}
.status-track{position:relative;display:block;box-sizing:border-box;width:100%;height:clamp(2px,1.5vh,.42rem);overflow:hidden;border:1px solid rgba(255,243,166,.5);border-radius:999px;background:#060a20}
.status-track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.05) 9% 10%)}
.status-track i{position:absolute;top:0;bottom:0;left:-35%;width:35%;border-radius:inherit;background:linear-gradient(90deg,#415cce,#8fa6ff 55%,#fff3a6);box-shadow:0 0 .7rem rgba(143,166,255,.8);animation:snake-load .65s linear infinite}
.status-text{max-width:100%;font-size:clamp(4px,min(3vw,8vh),.72rem);line-height:1.15;letter-spacing:.04em;color:#cbd4ff}
#status.is-finishing{opacity:0}
@keyframes snake-load{to{left:100%}}
@media (prefers-reduced-motion:reduce){#status{transition:none}.status-track i{animation:none;left:32%;width:36%}}
.emulator-root,.emulator-container,.emulator-canvas{width:100%!important;height:100%!important}
canvas{image-rendering:pixelated}
</style>
<script src="runtime/js-dos.js"></script>
<script id="emulators-js" src="runtime/emulators/emulators.js"></script>
</head>
<body>
<div id="dos"></div>
<div id="status" role="status" aria-live="polite">
  <div class="status-card">
    <strong id="status-title" class="status-title">NIBBLES</strong>
    <span class="status-track" aria-hidden="true"><i></i></span>
    <span id="status-text" class="status-text">loading DOS…</span>
  </div>
</div>
<script>
(function () {
  "use strict";
  var status = document.getElementById("status");
  var statusTitle = document.getElementById("status-title");
  var statusText = document.getElementById("status-text");
  var dosSurface = document.getElementById("dos");
  var params = new URLSearchParams(location.search);
  var lang = params.get("lang") === "cs" ? "cs" : "en";
  var mode = params.get("mode") === "dos" ? "dos" : "nibbles";
  var players = Math.max(1, Math.min(4, parseInt(params.get("players"), 10) || 1));
  var gameSpeed = Math.max(1, Math.min(100, parseInt(params.get("speed"), 10) || 50));
  var text = {
    en: { loading: "loading DOS…", setup: "setting up your game…", failed: "DOS could not start. Restart the app to retry." },
    cs: { loading: "načítám DOS…", setup: "nastavuji hru…", failed: "DOS se nepodařilo spustit. Zkuste aplikaci restartovat." }
  };
  statusTitle.textContent = mode === "dos" ? "DOS" : "NIBBLES";
  statusText.textContent = text[lang].loading;
  function tell(type, extra) {
    try { parent.postMessage(Object.assign({ type: type }, extra || {}), location.origin); } catch (_error) {}
  }
  var exitInput = "", atPrompt = mode === "dos";
  var directionKeys = { ArrowUp: "up", ArrowLeft: "left", ArrowRight: "right", ArrowDown: "down" };
  function handleExitKeys(event) {
    var direction = directionKeys[event.key];
    if (mode === "nibbles" && direction) tell("snake-direction", { direction: direction });
    if (event.key === "Escape" && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      tell("snake-close");
      return;
    }
    if (event.key === "Escape") {
      if (mode === "nibbles") {
        // Let DOSBox receive Esc and return from Nibbles before the parent tears
        // down this finished machine and brings the monitor desktop back.
        window.setTimeout(function () { tell("snake-exit"); }, 100);
        return;
      }
      exitInput = ""; atPrompt = true;
      return;
    }
    if (!atPrompt) return;
    if (event.key === "Backspace") exitInput = exitInput.slice(0, -1);
    else if (event.key === "Enter") {
      var command = exitInput.trim().toLowerCase();
      if (command === "exit") {
        event.preventDefault();
        event.stopPropagation();
        tell("snake-close");
      } else if (command === "nibbles" || command === "nibbles.exe") atPrompt = false;
      exitInput = "";
    } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
      exitInput += event.key;
      if (exitInput.length > 16) exitInput = exitInput.slice(-16);
    }
  }
  // Register before Dos() installs its keyboard plumbing; window capture sees Esc
  // before the emulator can consume it on the way to the canvas/worker.
  window.addEventListener("keydown", handleExitKeys, true);
  var runtimeDosboxConf = [
    "[sdl]",
    "autolock=true",
    "",
    "[dosbox]",
    "machine=svga_s3",
    "memsize=16",
    "",
    "[cpu]",
    "core=auto",
    "cycles=auto",
    "",
    "[mixer]",
    "nosound=true",
    "",
    "[midi]",
    "mpu401=none",
    "mididevice=none",
    "",
    "[sblaster]",
    "sbtype=none",
    "",
    "[gus]",
    "gus=false",
    "",
    "[speaker]",
    "pcspeaker=false",
    "tandy=off",
    "disney=false",
    "",
    "[autoexec]",
    "@echo off",
    "mount c .",
    "c:"
  ].concat(mode === "nibbles" ? ["NIBBLES.EXE", "exit"] : []).join("\n");
  var player = null;
  var runtimePaused = false;
  var nibblesCi = null, nibblesStartupTimer = null, nibblesStartupHeld = 0;
  var nibblesStartupIndex = 0, nibblesStartupArmed = false, nibblesStartupReady = false;
  var nibblesStartupComplete = false, runtimeReadyTold = false;
  var nibblesFrameSignature = "", nibblesStartBaseline = "", nibblesStartWaitAt = 0;
  var nibblesStartScreenChanged = false, nibblesStartScreenChangedAt = 0, nibblesSpaceSending = false;
  // Direct CommandInterface key codes: Enter is 257 (not DOM keyCode 13).
  // The leading/extra Enter safely handles either order of the sound and intro prompts.
  // The final Space is part of setup: revealing the canvas lands in a running level.
  var nibblesStartupKeys = [257, 78, 257, 257]; // intro / sound off
  function appendNibblesAnswer(value) {
    String(value).split("").forEach(function (character) { nibblesStartupKeys.push(character.charCodeAt(0)); });
    nibblesStartupKeys.push(257);
  }
  appendNibblesAnswer(players);
  appendNibblesAnswer(gameSpeed);
  [78, 257, 67, 257, 53, 257, 89, 257, 78, 257].forEach(function (keyCode) {
    nibblesStartupKeys.push(keyCode); // fixed defaults: no acceleration, colour, five lives, novice, normal length
  });
  for (var playerIndex = 0; playerIndex < players; playerIndex++) {
    nibblesStartupKeys.push(82, 257); // right-hand keyboard layout for every selected player
  }
  function frameSignature(rgb, rgba) {
    var pixels = rgba && rgba.length ? rgba : rgb;
    if (!pixels || !pixels.length) return "";
    var hash = 2166136261, stride = Math.max(4, Math.floor(pixels.length / 521));
    for (var offset = 0; offset < pixels.length; offset += stride) {
      hash ^= pixels[offset];
      hash = Math.imul(hash, 16777619);
    }
    return pixels.length + ":" + (hash >>> 0);
  }
  function observeNibblesFrame(rgb, rgba) {
    var next = frameSignature(rgb, rgba);
    if (!next) return;
    nibblesFrameSignature = next;
    if (nibblesStartWaitAt && (!nibblesStartBaseline || next !== nibblesStartBaseline)) {
      if (!nibblesStartScreenChanged) nibblesStartScreenChangedAt = performance.now();
      nibblesStartScreenChanged = true;
    }
  }
  function clearNibblesStartupTimer() {
    if (nibblesStartupTimer !== null) window.clearTimeout(nibblesStartupTimer);
    nibblesStartupTimer = null;
  }
  function scheduleNibblesStartup(delay) {
    clearNibblesStartupTimer();
    if (!nibblesStartupReady) return;
    if (nibblesStartupIndex >= nibblesStartupKeys.length) { waitForNibblesStartScreen(); return; }
    nibblesStartupTimer = window.setTimeout(stepNibblesStartup, delay);
  }
  function pulseNibblesSpace(done) {
    if (!nibblesCi) return false;
    try {
      nibblesCi.sendKeyEvent(32, true);
      window.dispatchEvent(new KeyboardEvent("keydown", {
        key: " ", code: "Space", keyCode: 32, which: 32, bubbles: true, cancelable: true
      }));
    } catch (_error) { return false; }
    window.setTimeout(function () {
      try { nibblesCi.sendKeyEvent(32, false); } catch (_error) {}
      window.dispatchEvent(new KeyboardEvent("keyup", {
        key: " ", code: "Space", keyCode: 32, which: 32, bubbles: true, cancelable: true
      }));
      if (done) done();
    }, 18);
    return true;
  }
  function sendNibblesStartSpace() {
    if (nibblesSpaceSending || nibblesStartupComplete || !nibblesCi) return;
    nibblesStartupHeld = 32;
    nibblesSpaceSending = true;
    // Setup is complete from the visitor's perspective. Keep retrying Space behind
    // the live game surface for slower DOS frames, without trapping play under a splash.
    finishNibblesStartup();
    // Tablets can spend well over a second painting the final prompt after DOS has
    // accepted its setup answers. Keep harmlessly tapping Space across that window.
    var remaining = 24;
    function sendNext() {
      if (!pulseNibblesSpace(function () {
        remaining--;
        if (remaining > 0) {
          nibblesStartupTimer = window.setTimeout(sendNext, 125);
          return;
        }
        nibblesStartupTimer = null;
        nibblesStartupHeld = 0;
        nibblesSpaceSending = false;
      })) {
        nibblesSpaceSending = false;
        nibblesStartupHeld = 0;
        nibblesStartupTimer = window.setTimeout(waitForNibblesStartScreen, 60);
      }
    }
    try { sendNext(); }
    catch (_error) {
      nibblesSpaceSending = false;
      nibblesStartupHeld = 0;
      nibblesStartupTimer = window.setTimeout(waitForNibblesStartScreen, 60);
    }
  }
  function waitForNibblesStartScreen() {
    clearNibblesStartupTimer();
    if (nibblesStartupComplete || nibblesSpaceSending || !nibblesCi) return;
    if (runtimePaused || document.hidden) {
      nibblesStartWaitAt = 0;
      nibblesStartScreenChanged = false;
      nibblesStartScreenChangedAt = 0;
      nibblesStartupTimer = window.setTimeout(waitForNibblesStartScreen, 80);
      return;
    }
    if (!nibblesStartWaitAt) {
      nibblesStartBaseline = nibblesFrameSignature;
      nibblesStartScreenChanged = false;
      nibblesStartScreenChangedAt = 0;
      nibblesStartWaitAt = performance.now();
    }
    var elapsed = performance.now() - nibblesStartWaitAt;
    // A changed DOS frame acknowledges the final start screen. The short fallback covers
    // render backends that do not expose frame data, while still keeping the longest setup fast.
    if ((nibblesStartScreenChanged && elapsed >= 90 && performance.now() - nibblesStartScreenChangedAt >= 32) ||
        elapsed >= 180) {
      sendNibblesStartSpace();
      return;
    }
    nibblesStartupTimer = window.setTimeout(waitForNibblesStartScreen, 16);
  }
  function finishNibblesStartup() {
    if (nibblesStartupComplete) return;
    nibblesStartupComplete = true;
    status.classList.add("is-finishing");
    window.setTimeout(function () {
      status.hidden = true;
      if (!runtimeReadyTold) { runtimeReadyTold = true; tell("snake-ready"); }
    }, 70);
  }
  document.addEventListener("pointerup", function (event) {
    if (mode !== "nibbles" || !nibblesCi || event.pointerType === "mouse" && event.button !== 0) return;
    event.preventDefault();
    pulseNibblesSpace();
  }, true);
  function stepNibblesStartup() {
    nibblesStartupTimer = null;
    if (!nibblesCi || mode !== "nibbles") return;
    if (nibblesStartupIndex >= nibblesStartupKeys.length) { waitForNibblesStartScreen(); return; }
    if (runtimePaused || document.hidden) { scheduleNibblesStartup(80); return; }
    var keyCode = nibblesStartupKeys[nibblesStartupIndex];
    if (nibblesStartupIndex === nibblesStartupKeys.length - 1 && !nibblesStartWaitAt) {
      nibblesStartBaseline = nibblesFrameSignature;
      nibblesStartScreenChanged = false;
      nibblesStartScreenChangedAt = 0;
      nibblesStartWaitAt = performance.now();
    }
    try {
      nibblesCi.sendKeyEvent(keyCode, true);
      nibblesStartupHeld = keyCode;
    } catch (_error) {
      scheduleNibblesStartup(80);
      return;
    }
    nibblesStartupTimer = window.setTimeout(function () {
      nibblesStartupTimer = null;
      try { nibblesCi.sendKeyEvent(keyCode, false); } catch (_error) {}
      nibblesStartupHeld = 0;
      nibblesStartupIndex++;
      scheduleNibblesStartup(keyCode === 257 ? 18 : 12);
    }, 8);
  }
  function waitForNibblesProgram() {
    clearNibblesStartupTimer();
    if (!nibblesCi || runtimePaused || nibblesStartupReady ||
        nibblesStartupIndex >= nibblesStartupKeys.length) return;
    if (typeof nibblesCi.getRunningProgram !== "function") {
      nibblesStartupReady = true;
      statusText.textContent = text[lang].setup;
      scheduleNibblesStartup(60);
      return;
    }
    var ci = nibblesCi;
    Promise.resolve(ci.getRunningProgram()).then(function (program) {
      if (nibblesCi !== ci || runtimePaused) return;
      var running = String(program || "").replace(/^.*[\\/]/, "").trim();
      if (/^NIBBLES(?:\.EXE)?$/i.test(running)) {
        nibblesStartupReady = true;
        statusText.textContent = text[lang].setup;
        scheduleNibblesStartup(60);
      } else {
        nibblesStartupTimer = window.setTimeout(waitForNibblesProgram, 60);
      }
    }).catch(function () {
      if (nibblesCi !== ci || runtimePaused) return;
      nibblesStartupReady = true;
      statusText.textContent = text[lang].setup;
      scheduleNibblesStartup(60);
    });
  }
  function armNibblesStartup(ci) {
    if (mode !== "nibbles" || nibblesStartupArmed) return;
    nibblesStartupArmed = true;
    nibblesCi = ci;
    try {
      var ciEvents = ci.events && ci.events();
      if (ciEvents && typeof ciEvents.onFrame === "function") ciEvents.onFrame(observeNibblesFrame);
    } catch (_error) {}
    waitForNibblesProgram();
  }
  function pauseNibblesStartup() {
    clearNibblesStartupTimer();
    if (nibblesStartWaitAt && !nibblesSpaceSending) {
      nibblesStartWaitAt = 0;
      nibblesStartScreenChanged = false;
      nibblesStartScreenChangedAt = 0;
    }
    if (nibblesStartupHeld && nibblesCi) {
      try { nibblesCi.sendKeyEvent(nibblesStartupHeld, false); } catch (_error) {}
      if (nibblesSpaceSending) {
        nibblesStartupHeld = 0;
        nibblesSpaceSending = false;
        finishNibblesStartup();
        return;
      }
      nibblesStartupHeld = 0;
      nibblesStartupIndex++;
    }
  }
  emulators.pathPrefix = "runtime/emulators/";
  emulators.pathSuffix = "";
  function fail() {
    status.hidden = false;
    status.classList.remove("is-finishing");
    statusText.textContent = text[lang].failed;
    tell("snake-failed");
  }
  fetch("snake.jsdos?v=7a0a1895", { cache: "no-store" }).then(function (response) {
    if (!response.ok) throw new Error("bundle unavailable");
    return response.arrayBuffer();
  }).then(function (bundle) {
    // Patch a transient in-memory copy: archives are extracted after loose
    // initFs entries in this pinned emulator, so changing the archive config
    // itself is what reliably selects the requested autoexec.
    return emulators.bundleUpdateConfig(new Uint8Array(bundle), {
      dosboxConf: runtimeDosboxConf,
      jsdosConf: { version: "8" }
    });
  }).then(function (bundle) {
    player = Dos(document.getElementById("dos"), {
      dosboxConf: runtimeDosboxConf,
      jsdosConf: { version: "8" },
      // The deployed archive and owner executable remain byte-for-byte pinned;
      // only this disposable in-memory bundle has its config replaced.
      initFs: bundle,
      pathPrefix: "runtime/emulators/",
      backend: "dosbox",
      backendLocked: true,
      autoStart: true,
      autoSave: false,
      kiosk: true,
      imageRendering: "pixelated",
      renderBackend: "canvas",
      renderAspect: "4/3",
      mouseCapture: false,
      noCursor: true,
      volume: 0,
      theme: "black",
      lang: "en",
      onEvent: function (event, arg) {
        if (event === "ci-ready") armNibblesStartup(arg);
        if (mode === "dos" && (event === "ci-ready" || event === "bnd-play")) {
          status.hidden = true;
          if (!runtimeReadyTold) { runtimeReadyTold = true; tell("snake-ready"); }
        }
      }
    });
    if (runtimePaused) player.setPaused(true);
  }).catch(fail);
  window.addEventListener("error", fail);
  window.addEventListener("message", function (event) {
    if (event.origin !== location.origin || !event.data) return;
    if (event.data.type === "snake-key" && mode === "nibbles") {
      if (nibblesCi && (event.data.emuKeyCode || event.data.keyCode)) {
        try {
          nibblesCi.sendKeyEvent(event.data.emuKeyCode || event.data.keyCode, event.data.eventType !== "keyup");
          return;
        } catch (_error) {}
      }
      var forwarded = new KeyboardEvent(event.data.eventType === "keyup" ? "keyup" : "keydown", {
        key: event.data.key || "", code: event.data.code || "", location: event.data.location || 0,
        repeat: !!event.data.repeat, ctrlKey: !!event.data.ctrlKey, metaKey: !!event.data.metaKey,
        altKey: !!event.data.altKey, shiftKey: !!event.data.shiftKey, bubbles: true, cancelable: true
      });
      // js-dos 8.4 maps the legacy keyCode, so preserve it on the relayed event as well as key/code.
      try { Object.defineProperty(forwarded, "keyCode", { get: function () { return event.data.keyCode || 0; } }); } catch (_error) {}
      try { Object.defineProperty(forwarded, "which", { get: function () { return event.data.keyCode || 0; } }); } catch (_error2) {}
      window.dispatchEvent(forwarded);
      return;
    }
    if (event.data.type !== "snake-control") return;
    if (event.data.action === "pause") {
      runtimePaused = true;
      pauseNibblesStartup();
      if (player) player.setPaused(true);
    } else if (event.data.action === "resume") {
      runtimePaused = false;
      if (player) player.setPaused(false);
      if (nibblesStartupReady) scheduleNibblesStartup(60);
      else waitForNibblesProgram();
    } else if (event.data.action === "stop") {
      pauseNibblesStartup();
      nibblesCi = null;
      if (player) Promise.resolve(player.stop()).catch(function () {});
    }
  });
  document.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    tell("snake-context", {
      x: Math.max(0, Math.min(1, event.clientX / Math.max(1, innerWidth))),
      y: Math.max(0, Math.min(1, event.clientY / Math.max(1, innerHeight)))
    });
  }, true);
}());
</script>
</body>
</html>
