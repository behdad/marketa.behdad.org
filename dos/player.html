<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>snake</title>
<link rel="stylesheet" href="runtime/js-dos.css">
<style>
html,body,#dos{width:100%;height:100%;margin:0;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent}
body{font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:none}
#dos{position:relative}
#status{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:1rem;box-sizing:border-box;background:#000;color:#8fd070;text-align:center;font-size:clamp(10px,4vw,16px);line-height:1.35}
#status[hidden]{display:none}
.emulator-root,.emulator-container,.emulator-canvas{width:100%!important;height:100%!important}
canvas{image-rendering:pixelated}
</style>
<script src="runtime/js-dos.js"></script>
<script id="emulators-js" src="runtime/emulators/emulators.js"></script>
</head>
<body>
<div id="dos"></div>
<div id="status">loading DOS…</div>
<script>
(function () {
  "use strict";
  var status = document.getElementById("status");
  var params = new URLSearchParams(location.search);
  var lang = params.get("lang") === "cs" ? "cs" : "en";
  var mode = params.get("mode") === "dos" ? "dos" : "nibbles";
  var text = {
    en: { loading: "loading DOS…", failed: "DOS could not start. Restart the app to retry." },
    cs: { loading: "načítám DOS…", failed: "DOS se nepodařilo spustit. Zkuste aplikaci restartovat." }
  };
  status.textContent = text[lang].loading;
  function tell(type, extra) {
    try { parent.postMessage(Object.assign({ type: type }, extra || {}), location.origin); } catch (_error) {}
  }
  var exitInput = "", atPrompt = mode === "dos";
  function handleExitKeys(event) {
    if (event.key === "Escape" && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      tell("snake-close");
      return;
    }
    if (event.key === "Escape") {
      if (mode === "nibbles") {
        // Let DOSBox receive Esc and return from Nibbles before the parent tears
        // down this finished machine and brings the monitor desktop back.
        window.setTimeout(function () { tell("snake-exit"); }, 100);
        return;
      }
      exitInput = ""; atPrompt = true;
      return;
    }
    if (!atPrompt) return;
    if (event.key === "Backspace") exitInput = exitInput.slice(0, -1);
    else if (event.key === "Enter") {
      var command = exitInput.trim().toLowerCase();
      if (command === "exit") {
        event.preventDefault();
        event.stopPropagation();
        tell("snake-close");
      } else if (command === "nibbles" || command === "nibbles.exe") atPrompt = false;
      exitInput = "";
    } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
      exitInput += event.key;
      if (exitInput.length > 16) exitInput = exitInput.slice(-16);
    }
  }
  // Register before Dos() installs its keyboard plumbing; window capture sees Esc
  // before the emulator can consume it on the way to the canvas/worker.
  window.addEventListener("keydown", handleExitKeys, true);
  var runtimeDosboxConf = [
    "[sdl]",
    "autolock=true",
    "",
    "[dosbox]",
    "machine=svga_s3",
    "memsize=16",
    "",
    "[cpu]",
    "core=auto",
    "cycles=auto",
    "",
    "[mixer]",
    "nosound=true",
    "",
    "[midi]",
    "mpu401=none",
    "mididevice=none",
    "",
    "[sblaster]",
    "sbtype=none",
    "",
    "[gus]",
    "gus=false",
    "",
    "[speaker]",
    "pcspeaker=false",
    "tandy=off",
    "disney=false",
    "",
    "[autoexec]",
    "@echo off",
    "mount c .",
    "c:"
  ].concat(mode === "nibbles" ? ["NIBBLES.EXE", "exit"] : []).join("\n");
  var player = null;
  var runtimePaused = false;
  var nibblesCi = null, nibblesStartupTimer = null, nibblesStartupHeld = 0;
  var nibblesStartupIndex = 0, nibblesStartupArmed = false, nibblesStartupReady = false;
  // Direct CommandInterface key codes: Enter is 257 (not DOM keyCode 13).
  // The leading/extra Enter safely handles either order of the sound and intro prompts.
  // Single-character values also work whether a prompt reads INPUT or one key at a time.
  var nibblesStartupKeys = [
    257, 78, 257, 257, // intro / sound off
    49, 257,           // one player
    53, 257,           // skill 5
    78, 257,           // no speed increase
    67, 257,           // colour
    53, 257,           // five lives
    89, 257,           // novice controls
    78, 257,           // no length-conservation mode
    82, 257,           // right hand: arrow keys
    32                 // start level
  ];
  function clearNibblesStartupTimer() {
    if (nibblesStartupTimer !== null) window.clearTimeout(nibblesStartupTimer);
    nibblesStartupTimer = null;
  }
  function scheduleNibblesStartup(delay) {
    clearNibblesStartupTimer();
    if (!nibblesStartupReady || nibblesStartupIndex >= nibblesStartupKeys.length) return;
    nibblesStartupTimer = window.setTimeout(stepNibblesStartup, delay);
  }
  function stepNibblesStartup() {
    nibblesStartupTimer = null;
    if (!nibblesCi || mode !== "nibbles" || nibblesStartupIndex >= nibblesStartupKeys.length) return;
    if (runtimePaused || document.hidden) { scheduleNibblesStartup(120); return; }
    var keyCode = nibblesStartupKeys[nibblesStartupIndex];
    try {
      nibblesCi.sendKeyEvent(keyCode, true);
      nibblesStartupHeld = keyCode;
    } catch (_error) {
      scheduleNibblesStartup(120);
      return;
    }
    nibblesStartupTimer = window.setTimeout(function () {
      nibblesStartupTimer = null;
      try { nibblesCi.sendKeyEvent(keyCode, false); } catch (_error) {}
      nibblesStartupHeld = 0;
      nibblesStartupIndex++;
      scheduleNibblesStartup(keyCode === 257 ? 260 : 180);
    }, 48);
  }
  function waitForNibblesProgram() {
    clearNibblesStartupTimer();
    if (!nibblesCi || runtimePaused || nibblesStartupReady ||
        nibblesStartupIndex >= nibblesStartupKeys.length) return;
    if (typeof nibblesCi.getRunningProgram !== "function") {
      nibblesStartupReady = true;
      scheduleNibblesStartup(700);
      return;
    }
    var ci = nibblesCi;
    Promise.resolve(ci.getRunningProgram()).then(function (program) {
      if (nibblesCi !== ci || runtimePaused) return;
      var running = String(program || "").replace(/^.*[\\/]/, "").trim();
      if (/^NIBBLES(?:\.EXE)?$/i.test(running)) {
        nibblesStartupReady = true;
        scheduleNibblesStartup(700);
      } else {
        nibblesStartupTimer = window.setTimeout(waitForNibblesProgram, 120);
      }
    }).catch(function () {
      if (nibblesCi !== ci || runtimePaused) return;
      nibblesStartupReady = true;
      scheduleNibblesStartup(700);
    });
  }
  function armNibblesStartup(ci) {
    if (mode !== "nibbles" || nibblesStartupArmed) return;
    nibblesStartupArmed = true;
    nibblesCi = ci;
    waitForNibblesProgram();
  }
  function pauseNibblesStartup() {
    clearNibblesStartupTimer();
    if (nibblesStartupHeld && nibblesCi) {
      try { nibblesCi.sendKeyEvent(nibblesStartupHeld, false); } catch (_error) {}
      nibblesStartupHeld = 0;
      nibblesStartupIndex++;
    }
  }
  emulators.pathPrefix = "runtime/emulators/";
  emulators.pathSuffix = "";
  function fail() {
    status.hidden = false;
    status.textContent = text[lang].failed;
    tell("snake-failed");
  }
  fetch("snake.jsdos?v=7a0a1895", { cache: "no-store" }).then(function (response) {
    if (!response.ok) throw new Error("bundle unavailable");
    return response.arrayBuffer();
  }).then(function (bundle) {
    // Patch a transient in-memory copy: archives are extracted after loose
    // initFs entries in this pinned emulator, so changing the archive config
    // itself is what reliably selects the requested autoexec.
    return emulators.bundleUpdateConfig(new Uint8Array(bundle), {
      dosboxConf: runtimeDosboxConf,
      jsdosConf: { version: "8" }
    });
  }).then(function (bundle) {
    player = Dos(document.getElementById("dos"), {
      dosboxConf: runtimeDosboxConf,
      jsdosConf: { version: "8" },
      // The deployed archive and owner executable remain byte-for-byte pinned;
      // only this disposable in-memory bundle has its config replaced.
      initFs: bundle,
      pathPrefix: "runtime/emulators/",
      backend: "dosbox",
      backendLocked: true,
      autoStart: true,
      autoSave: false,
      kiosk: true,
      imageRendering: "pixelated",
      renderBackend: "canvas",
      renderAspect: "4/3",
      mouseCapture: false,
      noCursor: true,
      volume: 0,
      theme: "black",
      lang: "en",
      onEvent: function (event, arg) {
        if (event === "ci-ready") armNibblesStartup(arg);
        if (event === "ci-ready" || event === "bnd-play") {
          status.hidden = true;
          tell("snake-ready");
        }
      }
    });
    if (runtimePaused) player.setPaused(true);
  }).catch(fail);
  window.addEventListener("error", fail);
  window.addEventListener("message", function (event) {
    if (event.origin !== location.origin || !event.data) return;
    if (event.data.type === "snake-key" && mode === "nibbles") {
      var forwarded = new KeyboardEvent(event.data.eventType === "keyup" ? "keyup" : "keydown", {
        key: event.data.key || "", code: event.data.code || "", location: event.data.location || 0,
        repeat: !!event.data.repeat, ctrlKey: !!event.data.ctrlKey, metaKey: !!event.data.metaKey,
        altKey: !!event.data.altKey, shiftKey: !!event.data.shiftKey, bubbles: true, cancelable: true
      });
      // js-dos 8.4 maps the legacy keyCode, so preserve it on the relayed event as well as key/code.
      try { Object.defineProperty(forwarded, "keyCode", { get: function () { return event.data.keyCode || 0; } }); } catch (_error) {}
      try { Object.defineProperty(forwarded, "which", { get: function () { return event.data.keyCode || 0; } }); } catch (_error2) {}
      window.dispatchEvent(forwarded);
      return;
    }
    if (event.data.type !== "snake-control") return;
    if (event.data.action === "pause") {
      runtimePaused = true;
      pauseNibblesStartup();
      if (player) player.setPaused(true);
    } else if (event.data.action === "resume") {
      runtimePaused = false;
      if (player) player.setPaused(false);
      if (nibblesStartupReady) scheduleNibblesStartup(120);
      else waitForNibblesProgram();
    } else if (event.data.action === "stop") {
      pauseNibblesStartup();
      nibblesCi = null;
      if (player) Promise.resolve(player.stop()).catch(function () {});
    }
  });
  document.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    tell("snake-context", {
      x: Math.max(0, Math.min(1, event.clientX / Math.max(1, innerWidth))),
      y: Math.max(0, Math.min(1, event.clientY / Math.max(1, innerHeight)))
    });
  });
}());
</script>
</body>
</html>
