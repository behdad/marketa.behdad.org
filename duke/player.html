<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duke Nukem 3D Shareware</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#ccc;font-family:system-ui,-apple-system,sans-serif}
#container{width:100%;height:100%;display:grid;place-items:center}
#canvas{grid-area:1/1;display:block;width:min(100vw,133.333vh)!important;height:auto!important;max-width:100vw!important;max-height:100vh!important;aspect-ratio:4/3!important;background:#000;outline:none;image-rendering:pixelated}
#controls{grid-area:1/1;place-self:end stretch;display:flex;align-items:center;justify-content:center;padding:3px;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
#controls button{display:none;background:#222;color:#ccc;border:1px solid #333;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px;border-radius:3px}
#controls button:hover{background:#333}
#status{font:11px/1.3 ui-monospace,monospace;color:#e8c060;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#status:empty{display:none}
#output{display:none;width:100%;height:160px;background:#000;color:#0f0;font:13px/1.4 monospace;border:1px solid #222;padding:4px;resize:vertical}
#dropzone{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;cursor:pointer}
#dropzone.hidden{display:none}
#dropzone p{color:#888;font-size:18px;margin-bottom:12px}
#dropzone .hint{color:#555;font-size:13px}
#dropzone.dragover{background:rgba(0,0,0,.95)}
#dropzone.dragover p{color:#fff}
#audio-hint{display:none}
#audio-hint.hidden{opacity:0;pointer-events:none}
#footer{display:none}
#footer a{color:#888;text-decoration:none;border-bottom:1px dotted #3a3a3a}
#footer a:hover{color:#ccc;border-bottom-color:#666}
#footer .sep{color:#333;margin:0 6px}
#touch-pad{--touch-cell:clamp(25px,16.6vmin,76px);display:none;position:fixed;z-index:4;left:max(0px,env(safe-area-inset-left));bottom:max(clamp(5px,2vmin,14px),env(safe-area-inset-bottom));grid-template:repeat(3,var(--touch-cell))/repeat(3,var(--touch-cell));justify-content:center;gap:clamp(2px,1.4vmin,8px);border-radius:clamp(5px,3vmin,16px);touch-action:none;cursor:grab;background:linear-gradient(90deg,transparent 31%,rgba(65,100,255,.28) 31% 69%,transparent 69%),linear-gradient(transparent 31%,rgba(65,100,255,.28) 31% 69%,transparent 69%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#touch-pad[hidden]{display:none}
#touch-pad::before{content:"";grid-area:2/2;width:53.333%;height:53.333%;place-self:center;border:clamp(.45px,.12vmin,1px) solid #6579dc;border-radius:50%;background:#253fc8;box-shadow:0 0 clamp(1px,.25vmin,1.5px) rgba(65,100,255,.75);pointer-events:none}
#touch-pad.dragging{cursor:grabbing}
#touch-pad.dragging::before{background:#ffd83d;border-color:#f5d7a1;box-shadow:0 0 clamp(1.5px,.35vmin,2.5px) rgba(255,216,61,.85)}
#touch-pad button{box-sizing:border-box;min-width:0;padding:0;border:0;border-radius:clamp(3px,2vmin,10px);background:#182252;color:#f8f5ec;font:700 clamp(10px,7.5vmin,32px)/1 ui-monospace,monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch-pad [data-dir="up left"]{grid-area:1/1}#touch-pad [data-dir=up]{grid-area:1/2}#touch-pad [data-dir="up right"]{grid-area:1/3}#touch-pad [data-dir=left]{grid-area:2/1}#touch-pad [data-dir=right]{grid-area:2/3}#touch-pad [data-dir="down left"]{grid-area:3/1}#touch-pad [data-dir=down]{grid-area:3/2}#touch-pad [data-dir="down right"]{grid-area:3/3}
@media (any-pointer:coarse),(hover:none){#touch-pad{display:grid}}
canvas:fullscreen,canvas:-webkit-full-screen{width:min(100vw,133.333vh)!important;height:auto!important;background:#000}
</style>
</head>
<body>
<div id="container">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <nav id="touch-pad" aria-label="Touch movement controls" hidden>
    <button type="button" class="touch-pad-button" data-dir="up left" aria-label="Move forward and left" aria-pressed="false">↖</button>
    <button type="button" class="touch-pad-button" data-dir="up" data-touch-key="w" aria-label="Move forward" aria-pressed="false">↑</button>
    <button type="button" class="touch-pad-button" data-dir="up right" aria-label="Move forward and right" aria-pressed="false">↗</button>
    <button type="button" class="touch-pad-button" data-dir="left" data-touch-key="a" aria-label="Move left" aria-pressed="false">←</button>
    <button type="button" class="touch-pad-button" data-dir="right" data-touch-key="d" aria-label="Move right" aria-pressed="false">→</button>
    <button type="button" class="touch-pad-button" data-dir="down left" aria-label="Move backward and left" aria-pressed="false">↙</button>
    <button type="button" class="touch-pad-button" data-dir="down" data-touch-key="s" aria-label="Move backward" aria-pressed="false">↓</button>
    <button type="button" class="touch-pad-button" data-dir="down right" aria-label="Move backward and right" aria-pressed="false">↘</button>
  </nav>
  <div id="controls">
    <button id="btn-fs">Fullscreen</button>
    <button id="btn-term">Terminal</button>
    <span id="status">Initializing...</span>
  </div>
  <textarea id="output" readonly></textarea>
  <footer id="footer">
    <a href="https://github.com/originalsouth/emduke32" target="_blank" rel="noopener">emduke32</a> — EDuke32 compiled to WebAssembly
    <span class="sep">·</span>
    <a href="https://github.com/originalsouth/emduke32" target="_blank" rel="noopener">source (GPL-2.0)</a>
    <span class="sep">·</span>
    MIDI: <a href="https://github.com/g200kg/webaudio-tinysynth" target="_blank" rel="noopener">webaudio-tinysynth</a> (Apache-2.0)
    <br>
    Duke Nukem 3D shareware episode &copy; 1996 3D Realms
  </footer>
</div>
<div id="dropzone" class="hidden">
  <p>Drop DUKE3D.GRP here or click to select</p>
  <div class="hint">Required game data file (~32 MB)</div>
  <input type="file" id="file-input" style="display:none" accept=".grp">
</div>
<div id="audio-hint">Click to enable audio</div>
<script>
'use strict';

var output = document.getElementById('output');
var statusEl = document.getElementById('status');
var canvas = document.getElementById('canvas');
var dropzone = document.getElementById('dropzone');
var fileInput = document.getElementById('file-input');
var btnFs = document.getElementById('btn-fs');
var btnTerm = document.getElementById('btn-term');
var audioHint = document.getElementById('audio-hint');
var termVisible = false;
var audioUnlocked = false;

function log(text) {
  output.value += text + '\n';
  output.scrollTop = output.scrollHeight;
}

var Module = {
  arguments: ['-nosetup', '-nologo', '-v1', '-l1', '-s2'],
  canvas: canvas,
  print: function() { log(Array.prototype.slice.call(arguments).join(' ')); },
  printErr: function() { log(Array.prototype.slice.call(arguments).join(' ')); },
  setStatus: function(text) {
    if (!text || (runtimeReady && /^(Ready|Running|Starting game)/.test(text))) {
      statusEl.textContent = '';
      return;
    }
    statusEl.textContent = text;
    var m = text.match(/(\d+)\/(\d+)/);
    if (m) statusEl.textContent = 'Loading... ' + m[1] + '/' + m[2];
  },
  totalDependencies: 0,
  monitorRunDependencies: function(left) {
    this.totalDependencies = Math.max(this.totalDependencies, left);
    this.setStatus(left ? 'Loading... ' + (this.totalDependencies - left) + '/' + this.totalDependencies : 'Ready');
  }
};
window.Module = Module;
var parentActive = true;
var runtimeReady = false;
var runtimePaused = false;
var scaledMouseDispatch = false;
var engineMousemoveHandlers = [];
var touchPad = document.getElementById('touch-pad');
var touchDrag = null;
var touchHeldKeys = [];
var touchDirectionKeys = { up:'w', left:'a', right:'d', down:'s' };
var touchReverse = { up:'down', down:'up', left:'right', right:'left' };

function emitTouchKey(type, key) {
  var upper = key.toUpperCase(), code = 'Key' + upper, keyCode = upper.charCodeAt(0);
  canvas.dispatchEvent(new KeyboardEvent(type, { key:key, code:code, keyCode:keyCode, which:keyCode, bubbles:true, cancelable:true }));
}
function setTouchDirection(direction) {
  var keys = direction ? direction.split(' ').map(function(part) { return touchDirectionKeys[part]; }).filter(Boolean) : [];
  touchHeldKeys.filter(function(key) { return keys.indexOf(key) < 0; }).forEach(function(key) { emitTouchKey('keyup', key); });
  keys.filter(function(key) { return touchHeldKeys.indexOf(key) < 0; }).forEach(function(key) { emitTouchKey('keydown', key); });
  touchHeldKeys = keys;
  var buttons = touchPad ? touchPad.querySelectorAll('[data-dir]') : [];
  for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute('aria-pressed', buttons[i].getAttribute('data-dir') === direction ? 'true' : 'false');
}
function releaseTouchKeys() {
  var pointerId = touchDrag && touchDrag.pointerId;
  touchDrag = null;
  if (touchPad) touchPad.classList.remove('dragging');
  setTouchDirection('');
  if (pointerId != null && touchPad) { try { touchPad.releasePointerCapture(pointerId); } catch (_) {} }
}
if (touchPad) {
  function endTouchDrag(event) {
    if (!touchDrag || (event && event.pointerId !== touchDrag.pointerId)) return;
    if (event) { event.preventDefault(); event.stopPropagation(); }
    releaseTouchKeys();
  }
  touchPad.addEventListener('pointerdown', function(event) {
    if ((event.button !== undefined && event.button !== 0) || touchDrag) return;
    event.preventDefault(); event.stopPropagation();
    try { parent.postMessage({ kind:'shoot-touch-control', game:'duke' }, location.origin); } catch (_) {}
    var button = event.target.closest && event.target.closest('[data-dir]');
    var rect = touchPad.getBoundingClientRect();
    touchDrag = {
      pointerId:event.pointerId, x:event.clientX, y:event.clientY,
      lastDir:button ? button.getAttribute('data-dir') : null,
      threshold:Math.max(3, Math.min(7, Math.min(rect.width, rect.height) * .16))
    };
    touchPad.classList.add('dragging');
    try { touchPad.setPointerCapture(event.pointerId); } catch (_) {}
    if (touchDrag.lastDir) setTouchDirection(touchDrag.lastDir);
  });
  // Match Hack-Man's live direction pad: re-anchor after turns and require extra travel to reverse.
  touchPad.addEventListener('pointermove', function(event) {
    if (!touchDrag || event.pointerId !== touchDrag.pointerId) return;
    event.preventDefault(); event.stopPropagation();
    var dx = event.clientX - touchDrag.x, dy = event.clientY - touchDrag.y;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < touchDrag.threshold) return;
    var diagonal = ax >= touchDrag.threshold && ay >= touchDrag.threshold && Math.max(ax, ay) < Math.min(ax, ay) * 1.8;
    var direction = diagonal ? (dy > 0 ? 'down' : 'up') + ' ' + (dx > 0 ? 'right' : 'left') : ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    var needed = touchDrag.lastDir && touchReverse[touchDrag.lastDir] === direction ? touchDrag.threshold * 1.55 : touchDrag.threshold;
    if (Math.max(ax, ay) < needed) return;
    touchDrag.x = event.clientX; touchDrag.y = event.clientY;
    if (direction === touchDrag.lastDir) return;
    touchDrag.lastDir = direction;
    setTouchDirection(direction);
  });
  touchPad.addEventListener('pointerup', endTouchDrag);
  touchPad.addEventListener('pointercancel', endTouchDrag);
  touchPad.addEventListener('lostpointercapture', endTouchDrag);
  touchPad.addEventListener('click', function(event) { event.preventDefault(); });
  ['contextmenu','selectstart','dragstart'].forEach(function(type) {
    touchPad.addEventListener(type, function(event) { event.preventDefault(); event.stopPropagation(); });
  });
}

function shouldRun() {
  return parentActive && !document.hidden;
}
function syncRuntime() {
  if (!runtimeReady) return;
  var run = shouldRun();
  if (run && runtimePaused) {
    try { Module.resumeMainLoop(); } catch (e) {}
    runtimePaused = false;
  } else if (!run && !runtimePaused) {
    try { Module.pauseMainLoop(); } catch (e) {}
    runtimePaused = true;
  }
  try {
    if (Module.SDL2 && Module.SDL2.audioContext)
      run ? Module.SDL2.audioContext.resume() : Module.SDL2.audioContext.suspend();
  } catch (e) {}
  try {
    if (window.tinySynth && window.tinySynth.getAudioContext) {
      var synthCtx = window.tinySynth.getAudioContext();
      if (synthCtx) run ? synthCtx.resume() : synthCtx.suspend();
    }
  } catch (e) {}
}
window.addEventListener('message', function(e) {
  if (e.origin !== location.origin || !e.data || e.data.kind !== 'shoot-control') return;
  parentActive = !!e.data.active;
  if (!parentActive) releaseTouchKeys();
  syncRuntime();
});
window.addEventListener('focus', syncRuntime);
window.addEventListener('blur', syncRuntime);
window.addEventListener('blur', releaseTouchKeys);
canvas.addEventListener('pointerdown', function() {
  try { window.focus(); canvas.focus({ preventScroll: true }); } catch (e) {}
  syncRuntime();
});
var touchAim = null;
window.addEventListener('pointerdown', function(event) {
  if (event.pointerType !== 'touch' || event.target !== canvas) return;
  event.preventDefault(); event.stopImmediatePropagation();
  touchAim = { id:event.pointerId, x:event.clientX, y:event.clientY, sx:event.clientX, sy:event.clientY, moved:false };
  try { canvas.setPointerCapture(event.pointerId); } catch (e) {}
}, true);
window.addEventListener('pointermove', function(event) {
  if (!touchAim || event.pointerId !== touchAim.id) return;
  event.preventDefault(); event.stopImmediatePropagation();
  var dx = event.clientX - touchAim.x, dy = event.clientY - touchAim.y;
  if (Math.hypot(event.clientX - touchAim.sx, event.clientY - touchAim.sy) > 5) touchAim.moved = true;
  touchAim.x = event.clientX; touchAim.y = event.clientY;
  var mouseMove = new MouseEvent('mousemove', {
    bubbles:true, cancelable:true, clientX:event.clientX, clientY:event.clientY
  });
  try { Object.defineProperty(mouseMove, 'movementX', { value:dx * 12 }); } catch (_) {}
  try { Object.defineProperty(mouseMove, 'movementY', { value:dy * 12 }); } catch (_) {}
  if (engineMousemoveHandlers.length) engineMousemoveHandlers.forEach(function(entry) {
    try {
      if (typeof entry.listener === 'function') entry.listener.call(entry.target, mouseMove);
      else if (entry.listener && entry.listener.handleEvent) entry.listener.handleEvent(mouseMove);
    } catch (error) { console.error(error); }
  });
  else canvas.dispatchEvent(mouseMove);
}, true);
function finishTouchAim(event) {
  if (!touchAim || event.pointerId !== touchAim.id) return;
  event.preventDefault(); event.stopImmediatePropagation();
  if (!touchAim.moved) {
    canvas.dispatchEvent(new MouseEvent('mousedown', { bubbles:true, button:0, buttons:1 }));
    canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles:true, button:0 }));
  }
  touchAim = null;
}
window.addEventListener('pointerup', finishTouchAim, true);
window.addEventListener('pointercancel', finishTouchAim, true);

// EDuke32's browser port sees raw pointer-lock deltas, which are far too hot at the
// monitor's scale. Feed SDL a quarter-delta event; the in-game sensitivity control
// still multiplies this baseline, so player adjustments continue to work.
window.addEventListener('mousemove', function(e) {
  if (!runtimeReady || scaledMouseDispatch || !parentActive) return;
  e.stopImmediatePropagation();
  var scaled = new MouseEvent('mousemove', {
    bubbles: true, cancelable: true, buttons: e.buttons,
    clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY
  });
  try {
    Object.defineProperty(scaled, 'movementX', { value: e.movementX * 0.25 });
    Object.defineProperty(scaled, 'movementY', { value: e.movementY * 0.25 });
  } catch (err) {}
  scaledMouseDispatch = true;
  canvas.dispatchEvent(scaled);
  scaledMouseDispatch = false;
}, true);

// This EDuke32 generation defaults forward/back to W/S while the original Duke
// layout used Up/Down. Alias only those two arrows; Left/Right already turn.
var dukeArrowAlias = { ArrowUp: ['w', 'KeyW', 87], ArrowDown: ['s', 'KeyS', 83] };
function dispatchDukeArrowAlias(e) {
  var alias = dukeArrowAlias[e.key];
  if (!alias || !runtimeReady) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  var forwarded = new KeyboardEvent(e.type, {
    key: alias[0], code: alias[1], keyCode: alias[2], which: alias[2],
    bubbles: true, cancelable: true, repeat: e.repeat
  });
  canvas.dispatchEvent(forwarded);
}
window.addEventListener('keydown', dispatchDukeArrowAlias, true);
window.addEventListener('keyup', dispatchDukeArrowAlias, true);

// --- Web Audio unlock + TinySynth init ---
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  audioHint.classList.add('hidden');
  // Resume emscripten's SDL2 AudioContext
  try {
    if (Module.SDL2 && Module.SDL2.audioContext) Module.SDL2.audioContext.resume();
  } catch (e) {}
  // Resume TinySynth's AudioContext
  try {
    if (window.tinySynth && window.tinySynth.getAudioContext)
      window.tinySynth.getAudioContext().resume();
  } catch (e) {}
}
document.addEventListener('click', unlockAudio, { once: false });
document.addEventListener('keydown', unlockAudio, { once: false });
document.addEventListener('pointerlockchange', function() {
  if (!document.pointerLockElement) return;
  try { parent.postMessage({ kind: 'shoot-pointer-lock', game: 'duke' }, location.origin); } catch (e) {}
});
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  try { parent.postMessage({ kind: 'shoot-contextmenu', game: 'duke', x: e.clientX / innerWidth, y: e.clientY / innerHeight }, location.origin); } catch (err) {}
});

// --- Visibility handling ---
// When the tab is backgrounded, setInterval/setTimeout (and therefore
// emscripten_sleep) get throttled to ~1 Hz. On resume, TinySynth's scheduler
// would try to catch up by scheduling every missed MIDI event at once, and
// the stale playTime offset can wedge the audio graph — visible as a black
// canvas because the main thread is tied up. We stop the synth on hide and
// re-arm timing on show.
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') {
    if (midiPollInterval) {
      clearInterval(midiPollInterval);
      midiPollInterval = null;
    }
    try { if (window.tinySynth) window.tinySynth.stopMIDI(); } catch (e) {}
  } else {
    try {
      if (Module.SDL2 && Module.SDL2.audioContext) Module.SDL2.audioContext.resume();
    } catch (e) {}
    try {
      if (window.tinySynth && window.tinySynth.getAudioContext) {
        var ctx = window.tinySynth.getAudioContext();
        if (ctx) {
          ctx.resume();
          window.tinySynth.playTime = ctx.currentTime + 0.1;
        }
      }
    } catch (e) {}
    if (window.tinySynth) startMidiPolling();
    // Nudge SDL2 to re-query canvas size and push one fresh frame in case
    // the backbuffer was invalidated while hidden.
    requestAnimationFrame(function() {
      try { window.dispatchEvent(new Event('resize')); } catch (e) {}
    });
  }
  syncRuntime();
});

// Initialize TinySynth after vendor/webaudio-tinysynth/webaudio-tinysynth.js loads.
function initTinySynth() {
  if (typeof WebAudioTinySynth !== 'undefined' && !window.tinySynth) {
    window.tinySynth = new WebAudioTinySynth({quality:1, useReverb:1});
    window.tinySynth.setMasterVol(0.5);
    // Gate scheduling while the tab is hidden: when timers resume after a
    // long background throttle, TinySynth's internal scheduler would otherwise
    // synchronously schedule every missed MIDI event, spawning thousands of
    // WebAudio nodes at once and stalling the main thread.
    var _origSend = window.tinySynth.send;
    window.tinySynth.send = function(msg, t) {
      if (document.hidden) return;
      return _origSend(msg, t);
    };
    console.log('TinySynth MIDI synthesizer ready');
  }
}

// --- MIDI polling (reads commands set by C code, avoids synchronous JS-from-wasm calls) ---
var midiPollInterval = null;
function startMidiPolling() {
  if (midiPollInterval) return;
  var getCmd = function() { return Module._emduke_getMidiCommand(); };
  var getData = function() { return Module._emduke_getMidiData(); };
  var getSize = function() { return Module._emduke_getMidiSize(); };
  var getLoop = function() { return Module._emduke_getMidiLoop(); };
  var getVol = function() { return Module._emduke_getMidiVolume(); };
  var clearCmd = function() { Module._emduke_clearMidiCommand(); };
  var lastVol = -1;
  midiPollInterval = setInterval(function() {
    if (!window.tinySynth) return;
    var cmd = getCmd();
    if (cmd === 1) {
      var ptr = getData();
      var size = getSize();
      var loop = getLoop();
      console.log('MIDI play cmd: ptr=' + ptr + ' size=' + size + ' loop=' + loop);
      if (ptr && size > 0) {
        try {
          var heap = new Uint8Array(Module.wasmMemory.buffer);
          var arr = heap.slice(ptr, ptr + size);
          window.tinySynth.stopMIDI();
          window.tinySynth.setLoop(loop ? 1 : 0);
          window.tinySynth.loadMIDI(arr.buffer);
          window.tinySynth.playMIDI();
        } catch(e) { console.error('MIDI play error:', e); }
      }
      clearCmd();
    } else if (cmd === 2) {
      window.tinySynth.stopMIDI();
      clearCmd();
    }
    var vol = getVol();
    if (vol !== lastVol) { window.tinySynth.setMasterVol(vol / 255.0); lastVol = vol; }
  }, 50);
}

// --- WebGL context loss ---
// alert() blocks the JS loop and makes the page feel frozen; show a
// non-blocking overlay instead. preventDefault() lets the browser attempt
// restoration, which we log for diagnostic purposes — Emscripten's GL layer
// doesn't actually recover, so the click-to-reload path is the escape hatch.
canvas.addEventListener('webglcontextlost', function(e) {
  e.preventDefault();
  log('[webgl] context lost');
  var overlay = document.getElementById('webgl-lost');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'webgl-lost';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;color:#ccc;font:16px/1.5 system-ui,sans-serif;cursor:pointer;z-index:20;text-align:center;padding:20px';
    overlay.innerHTML = '<div>WebGL context lost<br><span style="font-size:13px;color:#888">Click to reload</span></div>';
    overlay.addEventListener('click', function() { location.reload(); });
    document.body.appendChild(overlay);
  }
});
canvas.addEventListener('webglcontextrestored', function() {
  log('[webgl] context restored');
});

// --- Fullscreen ---
function toggleFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    canvas.requestFullscreen().catch(function() {});
  }
}
btnFs.addEventListener('click', toggleFullscreen);
document.addEventListener('keydown', function(e) {
  if (e.altKey && e.key === 'Enter') { e.preventDefault(); toggleFullscreen(); }
});
document.addEventListener('fullscreenchange', function() {
  if (document.fullscreenElement === canvas) {
    canvas.requestPointerLock();
    btnFs.textContent = 'Exit Fullscreen';
  } else {
    if (document.pointerLockElement) document.exitPointerLock();
    btnFs.textContent = 'Fullscreen';
  }
});

// --- Terminal toggle ---
btnTerm.addEventListener('click', function() {
  termVisible = !termVisible;
  output.style.display = termVisible ? 'block' : 'none';
  btnTerm.textContent = termVisible ? 'Hide Terminal' : 'Terminal';
});

// ===== Persistent storage (IndexedDB) for eduke32 cfg + save files =====
// Mirrors /home/web_user/.eduke32 between MEMFS and an IndexedDB object store so
// settings, save games and user-modified configs survive page reloads. The GRP
// and other bulky container formats are excluded — the user re-supplies them.
var EDUKE_DIR = '/home/web_user/.eduke32';
var IDB_NAME = 'emduke32';
var IDB_STORE = 'files';
var MAX_PERSIST_SIZE = 16 * 1024 * 1024; // skip anything larger per-file
var FLUSH_INTERVAL_MS = 10000;
var idbDB = null;
var lastFlushed = {};        // relPath -> {size, mtime}
var flushTimer = null;
var flushInProgress = false;
var persistRequested = false;
var statusResetTimer = null;

function idbOpen() {
  return new Promise(function(resolve, reject) {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function() { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function() { reject(req.error); };
    req.onblocked = function() { reject(new Error('IndexedDB blocked')); };
  });
}
function idbGetAll(db) {
  return new Promise(function(resolve, reject) {
    var out = [];
    var tx = db.transaction(IDB_STORE, 'readonly');
    var cur = tx.objectStore(IDB_STORE).openCursor();
    cur.onsuccess = function() {
      var c = cur.result;
      if (c) { out.push({ key: c.key, value: c.value }); c.continue(); }
      else { resolve(out); }
    };
    cur.onerror = function() { reject(cur.error); };
  });
}
function idbPut(db, key, value) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = function() { resolve(); };
    tx.onerror = function() { reject(tx.error); };
    tx.onabort = function() { reject(tx.error || new Error('tx aborted')); };
  });
}
function idbDelete(db, key) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = function() { resolve(); };
    tx.onerror = function() { reject(tx.error); };
  });
}

function shouldSkipFile(rel, size) {
  if (size > MAX_PERSIST_SIZE) return true;
  var u = rel.toUpperCase();
  if (u.length >= 4) {
    var ext = u.substring(u.length - 4);
    if (ext === '.GRP' || ext === '.ZIP' || ext === '.SSI') return true;
  }
  return false;
}

function fsWalk(dir, prefix, out) {
  var entries;
  try { entries = Module.FS.readdir(dir); } catch (e) { return; }
  for (var i = 0; i < entries.length; i++) {
    var name = entries[i];
    if (name === '.' || name === '..') continue;
    var full = dir + '/' + name;
    var rel = prefix ? (prefix + '/' + name) : name;
    var st;
    try { st = Module.FS.stat(full); } catch (e) { continue; }
    if (Module.FS.isDir(st.mode)) {
      fsWalk(full, rel, out);
    } else if (Module.FS.isFile(st.mode)) {
      out.push({ full: full, rel: rel, size: st.size, mtime: +st.mtime });
    }
  }
}

function briefStatus(text) {
  statusEl.textContent = text;
  if (statusResetTimer) clearTimeout(statusResetTimer);
  statusResetTimer = setTimeout(function() {
    if (statusEl.textContent === text) statusEl.textContent = '';
  }, 2500);
}

function requestPersistenceOnce() {
  if (persistRequested) return;
  persistRequested = true;
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(function(granted) {
      console.log('[storage] persistent storage ' + (granted ? 'granted' : 'best-effort'));
    }).catch(function() {});
  }
}

async function loadFromIDB() {
  try { idbDB = await idbOpen(); }
  catch (e) { console.warn('[storage] open failed:', e); return 0; }
  var entries;
  try { entries = await idbGetAll(idbDB); }
  catch (e) { console.warn('[storage] read failed:', e); return 0; }
  try { Module.FS.mkdir('/home/web_user'); } catch (e) { /* exists */ }
  try { Module.FS.mkdir(EDUKE_DIR); } catch (e) { /* exists */ }
  var count = 0;
  for (var i = 0; i < entries.length; i++) {
    var key = entries[i].key;
    var val = entries[i].value;
    if (typeof key !== 'string' || !val) continue;
    // Recreate nested directories if the key contains a path separator.
    var parts = key.split('/');
    var dir = EDUKE_DIR;
    for (var j = 0; j < parts.length - 1; j++) {
      dir += '/' + parts[j];
      try { Module.FS.mkdir(dir); } catch (e) { /* exists */ }
    }
    try {
      var bytes = val instanceof Uint8Array ? val : new Uint8Array(val);
      Module.FS.writeFile(EDUKE_DIR + '/' + key, bytes);
      count++;
    } catch (e) {
      console.warn('[storage] restore failed for ' + key + ':', e);
    }
  }
  // Prime lastFlushed so identical files are not re-written on the first flush.
  var files = [];
  fsWalk(EDUKE_DIR, '', files);
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (shouldSkipFile(f.rel, f.size)) continue;
    lastFlushed[f.rel] = { size: f.size, mtime: f.mtime };
  }
  return count;
}

async function flushToIDB() {
  if (flushInProgress || !idbDB || !Module.FS) return;
  flushInProgress = true;
  try {
    var files = [];
    fsWalk(EDUKE_DIR, '', files);
    var fsSet = {};
    var toWrite = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (shouldSkipFile(f.rel, f.size)) continue;
      fsSet[f.rel] = f;
      var last = lastFlushed[f.rel];
      if (!last || last.size !== f.size || last.mtime !== f.mtime) toWrite.push(f);
    }
    var toDelete = [];
    for (var rel in lastFlushed) {
      if (!(rel in fsSet)) toDelete.push(rel);
    }
    if (toWrite.length === 0 && toDelete.length === 0) return;

    var written = 0;
    var quotaHit = false;
    for (var i = 0; i < toWrite.length; i++) {
      var f = toWrite[i];
      try {
        var data = Module.FS.readFile(f.full);
        var buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
        await idbPut(idbDB, f.rel, buf);
        lastFlushed[f.rel] = { size: f.size, mtime: f.mtime };
        written++;
      } catch (e) {
        var msg = String(e && e.name || e);
        if (/Quota/i.test(msg)) { quotaHit = true; break; }
        console.warn('[storage] write failed for ' + f.rel + ':', e);
      }
    }
    for (var i = 0; i < toDelete.length; i++) {
      try {
        await idbDelete(idbDB, toDelete[i]);
        delete lastFlushed[toDelete[i]];
      } catch (e) {
        console.warn('[storage] delete failed for ' + toDelete[i] + ':', e);
      }
    }
    if (written > 0) {
      briefStatus('Saved ' + written + ' file' + (written > 1 ? 's' : ''));
      log('[storage] persisted ' + written + ' file(s)');
      requestPersistenceOnce();
    }
    if (quotaHit) {
      briefStatus('Storage full — saves may not persist');
      log('[storage] QuotaExceededError — some files not persisted');
    }
  } finally {
    flushInProgress = false;
  }
}

function startPersistence() {
  if (flushTimer) return;
  flushTimer = setInterval(flushToIDB, FLUSH_INTERVAL_MS);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') flushToIDB();
  });
  window.addEventListener('pagehide', function() { flushToIDB(); });
  window.addEventListener('beforeunload', function() { flushToIDB(); });
}

// Feed touch-look deltas directly to the SDL listeners installed by the engine. Synthetic
// canvas events are not consumed reliably by these older browser ports.
var nativeAddEventListener = EventTarget.prototype.addEventListener;
EventTarget.prototype.addEventListener = function(type, listener, options) {
  if (type === 'mousemove' && listener && (this === document || this === window || this === canvas)) {
    engineMousemoveHandlers.push({ target:this, listener:listener });
  }
  return nativeAddEventListener.call(this, type, listener, options);
};

// --- Load eduke32.js via script tag (pure script loader; init is owned by prepareInitSequence) ---
function loadEngine() {
  var ts = document.createElement('script');
  ts.src = 'vendor/webaudio-tinysynth/webaudio-tinysynth.js?v=' + Date.now();
  ts.onload = function() {
    initTinySynth();
    var s = document.createElement('script');
    s.src = 'eduke32.js?v=' + Date.now();
    s.async = true;
    document.body.appendChild(s);
  };
  ts.onerror = function() {
    // TinySynth missing — load engine without music (startMidiPolling will no-op).
    var s = document.createElement('script');
    s.src = 'eduke32.js?v=' + Date.now();
    s.async = true;
    document.body.appendChild(s);
  };
  document.body.appendChild(ts);
}

// --- Unified runtime-init sequencer ---
// Emscripten's callMain isn't in EXPORTED_RUNTIME_METHODS in this build, so we
// cannot use noInitialRun + manual callMain. Instead we block the auto-main-call
// by holding an addRunDependency until our async IDB restore (and optional GRP
// write) has completed. We also arrange for the restore to run AFTER the
// --preload-file package has finished extracting, so user-persisted cfgs
// override the default DUKE3D.CFG that ships in eduke32.data.
function prepareInitSequence(grpBuffer) {
  var idbTriggered = false;
  var idbArmed = false;

  function startIdbRestore() {
    if (idbTriggered) return;
    idbTriggered = true;
    (async function() {
      try {
        try { Module.FS.mkdir('/home/web_user'); } catch (e) { /* exists */ }
        try { Module.FS.mkdir(EDUKE_DIR); } catch (e) { /* exists */ }
        if (grpBuffer) {
          statusEl.textContent = 'Writing GRP to virtual FS...';
          Module.FS.writeFile(EDUKE_DIR + '/DUKE3D.GRP', new Uint8Array(grpBuffer));
        }
        statusEl.textContent = 'Restoring saved settings...';
        try {
          var n = await loadFromIDB();
          if (n > 0) log('[storage] restored ' + n + ' file(s) from browser storage');
        } catch (e) { console.warn('[storage] load failed:', e); }
        startPersistence();
      } finally {
        // Release our run dep so Emscripten proceeds to doRun() -> main().
        Module.removeRunDependency('emduke-init');
      }
    })();
  }

  // Chain onto monitorRunDependencies so we can detect "only our dep left".
  var prevMonitor = Module.monitorRunDependencies;
  Module.monitorRunDependencies = function(left) {
    if (prevMonitor) prevMonitor.call(this, left);
    if (idbArmed && !idbTriggered && left === 1) startIdbRestore();
  };

  // Queue our preRun handler BEFORE the engine script loads so it is iterated
  // first (then the engine's runWithFS preload handler runs second). Our
  // handler adds the gating run dep, and — if preload is active — arms the
  // monitor so we wait for preload's file writes before restoring from IDB.
  Module.preRun = Module.preRun || [];
  Module.preRun.push(function() {
    Module.addRunDependency('emduke-init');
    if ((Module.expectedDataFileDownloads || 0) > 0) {
      idbArmed = true; // monitor will fire startIdbRestore at left === 1
    } else {
      startIdbRestore(); // no preload — nothing to wait for
    }
  });

  Module.onRuntimeInitialized = function() {
    console.log('Runtime ready, _emduke_getMidiCommand:', typeof Module._emduke_getMidiCommand);
    console.log('TinySynth:', typeof window.tinySynth);
    startMidiPolling();
    statusEl.textContent = 'Starting game...';
    runtimeReady = true;
    touchPad.hidden = false;
    try { window.focus(); canvas.focus({ preventScroll: true }); } catch (e) {}
    try { parent.postMessage({ kind: 'shoot-status', game: 'duke', state: 'ready' }, location.origin); } catch (e) {}
    setTimeout(syncRuntime, 0);
    var lang = 'en';
    try { lang = parent.document.documentElement.lang === 'cs' ? 'cs' : 'en'; } catch (e) {}
    var controls = lang === 'cs'
      ? '↑↓ pohyb · ←→ otáčení · Ctrl střelba · mezerník otevřít'
      : '↑↓ move · ←→ turn · Ctrl fire · Space open';
    canvas.setAttribute('aria-label', controls);
    canvas.title = controls;
    statusEl.textContent = '';
    setTimeout(function() {
      if (runtimeReady && /^(Ready|Starting game\\.\\.\\.)$/.test(statusEl.textContent)) statusEl.textContent = '';
    }, 100);
    // Emscripten auto-calls main right after this hook returns.
  };
}

// --- GRP file upload path ---
function handleGRP(arrayBuffer) {
  dropzone.classList.add('hidden');
  statusEl.textContent = 'Loading engine...';
  prepareInitSequence(arrayBuffer);
  loadEngine();
}

function readFile(file) {
  var reader = new FileReader();
  reader.onload = function() { handleGRP(reader.result); };
  reader.readAsArrayBuffer(file);
}

// --- Drop zone events ---
dropzone.addEventListener('click', function(e) {
  if (e.target === fileInput) return;
  fileInput.click();
});
fileInput.addEventListener('change', function() {
  if (fileInput.files.length) readFile(fileInput.files[0]);
});
dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', function() { dropzone.classList.remove('dragover'); });
dropzone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
});

// Read one member of an ordinary ZIP without repacking the 1996 shareware
// release. The distribution license requires every original file to travel
// together unchanged, so the browser downloads the exact 3dduke13.zip and
// extracts DN3DSW13.SHR → DUKE3D.GRP only in memory.
async function zipMember(buffer, wanted) {
  var bytes = new Uint8Array(buffer), view = new DataView(buffer);
  var eocd = -1, floor = Math.max(0, bytes.length - 65557);
  for (var p = bytes.length - 22; p >= floor; p--) {
    if (view.getUint32(p, true) === 0x06054b50) { eocd = p; break; }
  }
  if (eocd < 0) throw new Error('ZIP directory missing');
  var entries = view.getUint16(eocd + 10, true);
  var at = view.getUint32(eocd + 16, true);
  var decoder = new TextDecoder();
  for (var i = 0; i < entries; i++) {
    if (view.getUint32(at, true) !== 0x02014b50) throw new Error('Bad ZIP directory');
    var method = view.getUint16(at + 10, true);
    var packed = view.getUint32(at + 20, true);
    var nameLen = view.getUint16(at + 28, true);
    var extraLen = view.getUint16(at + 30, true);
    var commentLen = view.getUint16(at + 32, true);
    var localAt = view.getUint32(at + 42, true);
    var name = decoder.decode(bytes.subarray(at + 46, at + 46 + nameLen));
    if (name.toUpperCase() === wanted.toUpperCase()) {
      if (view.getUint32(localAt, true) !== 0x04034b50) throw new Error('Bad ZIP member');
      var localName = view.getUint16(localAt + 26, true);
      var localExtra = view.getUint16(localAt + 28, true);
      var start = localAt + 30 + localName + localExtra;
      var chunk = bytes.slice(start, start + packed);
      if (method === 0) return chunk.buffer;
      if (method !== 8 || typeof DecompressionStream === 'undefined')
        throw new Error('Deflate is unavailable');
      var stream = new Blob([chunk]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return await new Response(stream).arrayBuffer();
    }
    at += 46 + nameLen + extraLen + commentLen;
  }
  throw new Error(wanted + ' not found');
}

statusEl.textContent = 'Loading shareware…';
fetch('3dduke13.zip').then(function(r) {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.arrayBuffer();
}).then(function(archive) {
  return zipMember(archive, 'DN3DSW13.SHR');
}).then(function(installerArchive) {
  return zipMember(installerArchive, 'DUKE3D.GRP');
}).then(function(grp) {
  if (grp.byteLength !== 11035779) throw new Error('Unexpected shareware payload');
  handleGRP(grp);
}).catch(function(error) {
  console.error(error);
  statusEl.textContent = 'Shareware offline.';
  statusEl.style.color = '#e0736a';
  try { parent.postMessage({ kind: 'shoot-status', game: 'duke', state: 'failed' }, location.origin); } catch (e) {}
});
</script>
