<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quake III — OpenArena</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:grid;place-items:center}
#canvas{grid-area:1/1;display:block;width:min(100vw,133.333vh)!important;height:auto!important;max-width:100vw!important;max-height:100vh!important;aspect-ratio:4/3!important;background:#000;outline:0}
#status{grid-area:1/1;z-index:1;margin:0;padding:0 4px;color:#e8c060;text-align:center;font:11px/1.3 ui-monospace,monospace;pointer-events:none}
#status.err{color:#e0736a}
#status:empty{display:none}
#arena-picker{grid-area:1/1;z-index:2;align-self:center;width:min(84vw,470px);box-sizing:border-box;padding:clamp(4px,1.5vh,10px) clamp(5px,2vh,14px);border:clamp(.5px,.3vh,2px) solid #6c5944;border-radius:clamp(2px,1.1vh,10px);background:#161210;color:#ead9b7;text-align:center;font:clamp(4px,2vh,9px)/1.3 ui-monospace,monospace;box-shadow:0 clamp(2px,1vh,8px) clamp(7px,3vh,28px) #000}
#arena-picker[hidden]{display:none}
#arena-picker strong{display:block;margin-bottom:clamp(3px,1vh,6px);color:#f1c96c;font:700 clamp(6px,2.8vh,10px)/1.15 ui-monospace,monospace;letter-spacing:.02em;white-space:nowrap}
#arena-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.5vmin,10px)}
.arena-choice{min-width:0;min-height:clamp(22px,11vh,36px);padding:clamp(3px,1.8vh,7px) 3px;border:clamp(.5px,.3vh,2px) solid #76644d;border-radius:clamp(2px,.8vh,7px);color:#fff8e8;font:inherit;text-shadow:0 1px 2px #000;cursor:pointer;touch-action:manipulation}
.arena-choice:nth-child(1){background:
  radial-gradient(circle at 52% 24%,rgba(208,247,255,.9) 0 5%,transparent 6%),
  linear-gradient(150deg,transparent 43%,rgba(105,202,219,.45) 44% 47%,transparent 48%),
  linear-gradient(#345864 0 48%,#162d35 49% 64%,#45646b 65%)}
.arena-choice:nth-child(2){background:
  linear-gradient(90deg,transparent 18%,rgba(232,164,101,.48) 19% 23%,transparent 24% 72%,rgba(232,164,101,.4) 73% 77%,transparent 78%),
  linear-gradient(160deg,transparent 50%,rgba(20,15,13,.5) 51% 61%,transparent 62%),
  linear-gradient(#714737,#301f1a)}
.arena-choice:nth-child(3){background:
  linear-gradient(125deg,transparent 34%,#ffb22e 35% 39%,transparent 40% 67%,#ff7b20 68% 72%,transparent 73%),
  radial-gradient(circle at 55% 80%,#d83b14,#6c1f16 54%,#271719 55%)}
.arena-choice:hover,.arena-choice:focus-visible{border-color:#f1c96c;outline:0;transform:translateY(-1px)}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<p id="status">Loading arena…</p>
<section id="arena-picker" aria-label="Choose an arena">
  <strong>Choose arena</strong>
  <div id="arena-choices">
    <button type="button" class="arena-choice" data-arena="oa_shine">Shine</button>
    <button type="button" class="arena-choice" data-arena="aggressor">Aggressor</button>
    <button type="button" class="arena-choice" data-arena="am_lavaarena">Lava Arena</button>
  </div>
</section>
<script type="module">
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");
const picker = document.getElementById("arena-picker");
const arenas = ["oa_shine", "aggressor", "am_lavaarena"];
let game = null;
let parentActive = true;
let paused = false;

function chooseArena() {
  return new Promise(resolve => {
    let picked = false;
    function pick(arena) {
      if (picked) return;
      picked = true;
      picker.hidden = true;
      try { localStorage.setItem("loft:q3-arena", arena); } catch (_) {}
      resolve(arena);
    }
    picker.addEventListener("click", event => {
      const button = event.target.closest("[data-arena]");
      if (button) pick(button.dataset.arena);
    });
    addEventListener("keydown", event => {
      if (picker.hidden || !/^[123]$/.test(event.key)) return;
      event.preventDefault();
      pick(arenas[Number(event.key) - 1]);
    });
  });
}

function tell(state) {
  try { parent.postMessage({ kind: "shoot-status", game: "q3", state }, location.origin); } catch (_) {}
}
function setStatus(text, isError) {
  status.textContent = text || "";
  status.className = isError ? "err" : "";
}
function audioContext() {
  return game && game.SDL2 && game.SDL2.audioContext;
}
function shouldRun() {
  return parentActive && !document.hidden;
}
function sync() {
  if (!game) return;
  const run = shouldRun();
  if (run && paused) {
    try { game.resumeMainLoop(); } catch (_) {}
    paused = false;
  } else if (!run && !paused) {
    try { game.pauseMainLoop(); } catch (_) {}
    paused = true;
  }
  const ctx = audioContext();
  if (ctx) {
    try { run ? ctx.resume() : ctx.suspend(); } catch (_) {}
  }
}

addEventListener("message", event => {
  if (event.origin !== location.origin || !event.data || event.data.kind !== "shoot-control") return;
  parentActive = !!event.data.active;
  sync();
});
addEventListener("focus", sync);
addEventListener("blur", sync);
document.addEventListener("visibilitychange", sync);
canvas.addEventListener("pointerdown", () => {
  try { window.focus(); } catch (_) {}
  try { canvas.focus({ preventScroll: true }); } catch (_) {}
  sync();
});
document.addEventListener("contextmenu", event => {
  event.preventDefault();
  try { parent.postMessage({ kind: "shoot-contextmenu", game: "q3", x: event.clientX / innerWidth, y: event.clientY / innerHeight }, location.origin); } catch (_) {}
});
document.addEventListener("pointerlockchange", () => {
  if (!document.pointerLockElement) return;
  try { parent.postMessage({ kind: "shoot-pointer-lock", game: "q3" }, location.origin); } catch (_) {}
});
document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey) event.stopImmediatePropagation();
}, true);

try {
  const arena = await chooseArena();
  setStatus("Loading " + picker.querySelector('[data-arena="' + arena + '"]').textContent + "…");
  const ioquake3 = (await import("./ioquake3.js")).default;
  const files = [
    { src: "baseoa/pak0.pk3", dst: "/baseoa" },
    { src: "baseoa/loft-shine.pk3", dst: "/baseoa" },
    { src: "baseoa/loft-arenas.pk3", dst: "/baseoa" }
  ];
  const fetches = files.map(file => fetch(file.src));
  game = await ioquake3({
    canvas,
    arguments: [
      "+set", "sv_pure", "0",
      "+set", "net_enabled", "0",
      "+set", "com_basegame", "baseoa",
      "+set", "cl_renderer", "opengl2",
      "+set", "r_preferOpenGLES", "1",
      "+set", "r_mode", "-1",
      "+set", "r_customwidth", "960",
      "+set", "r_customheight", "720",
      "+set", "r_fullscreen", "0",
      "+set", "r_hdr", "0",
      "+set", "r_postProcess", "0",
      "+set", "r_toneMap", "0",
      "+set", "r_autoExposure", "0",
      "+set", "r_normalMapping", "0",
      "+set", "r_specularMapping", "0",
      "+set", "r_deluxeMapping", "0",
      "+set", "sensitivity", "0.8",
      "+set", "cl_mouseAccel", "0",
      "+set", "s_volume", "0.32",
      "+set", "musicvolume", "0.18",
      "+set", "g_gametype", "0",
      "+set", "fraglimit", "5",
      "+map", arena,
      "+addbot", "sarge", "3"
    ],
    locateFile: file => "./" + file,
    preRun: [async module => {
      module.addRunDependency("loft-openarena-files");
      try {
        for (let i = 0; i < files.length; i++) {
          const response = await fetches[i];
          if (!response.ok) throw new Error(files[i].src + ": HTTP " + response.status);
          module.FS.mkdirTree(files[i].dst);
          module.FS.writeFile(
            files[i].dst + "/" + files[i].src.split("/").pop(),
            new Uint8Array(await response.arrayBuffer())
          );
        }
      } finally {
        module.removeRunDependency("loft-openarena-files");
      }
    }]
  });
  setStatus("");
  tell("ready");
  sync();
  try { canvas.focus({ preventScroll: true }); } catch (_) {}
} catch (error) {
  console.error(error);
  setStatus("Arena offline.", true);
  tell("failed");
}
</script>
</body>
</html>
