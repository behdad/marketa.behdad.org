<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quake III — OpenArena</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
#canvas{grid-area:1/1;display:block;width:min(100vw,133.333vh)!important;height:auto!important;max-width:100vw!important;max-height:100vh!important;aspect-ratio:4/3!important;background:#000;outline:0}
#touch-look{display:none;grid-area:1/1;z-index:3;width:min(100vw,133.333vh);max-width:100vw;max-height:100vh;aspect-ratio:4/3;touch-action:none;-webkit-touch-callout:none}
#touch-look[hidden]{display:none}
#status{grid-area:1/1;z-index:1;margin:0;padding:0 4px;color:#e8c060;text-align:center;font:11px/1.3 ui-monospace,monospace;pointer-events:none}
#status.err{color:#e0736a}
#status:empty{display:none}
#arena-picker{grid-area:1/1;z-index:2;align-self:center;width:min(84vw,760px);box-sizing:border-box;padding:clamp(8px,2.5vh,16px) clamp(10px,3vw,24px);border:clamp(1px,.5vh,3px) solid #6c5944;border-radius:clamp(5px,2vh,14px);background:#161210;color:#ead9b7;text-align:center;font:clamp(11px,3.6vh,19px)/1.3 ui-monospace,monospace;box-shadow:0 clamp(3px,1.5vh,10px) clamp(10px,5vh,32px) #000}
#arena-picker[hidden]{display:none}
#arena-picker strong{display:block;margin-bottom:clamp(7px,2vh,14px);color:#f1c96c;font:700 clamp(15px,5vh,26px)/1.15 ui-monospace,monospace;letter-spacing:.02em;white-space:nowrap}
#arena-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,2vmin,18px)}
.arena-choice{min-width:0;min-height:clamp(50px,23vh,86px);padding:clamp(8px,3vh,14px) 5px;border:clamp(1px,.5vh,3px) solid #76644d;border-radius:clamp(4px,1.5vh,10px);color:#fff8e8;font:inherit;text-shadow:0 1px 2px #000;cursor:pointer;touch-action:manipulation}
.arena-choice:nth-child(1){background:
  radial-gradient(circle at 52% 24%,rgba(208,247,255,.9) 0 5%,transparent 6%),
  linear-gradient(150deg,transparent 43%,rgba(105,202,219,.45) 44% 47%,transparent 48%),
  linear-gradient(#345864 0 48%,#162d35 49% 64%,#45646b 65%)}
.arena-choice:nth-child(2){background:
  linear-gradient(90deg,transparent 18%,rgba(232,164,101,.48) 19% 23%,transparent 24% 72%,rgba(232,164,101,.4) 73% 77%,transparent 78%),
  linear-gradient(160deg,transparent 50%,rgba(20,15,13,.5) 51% 61%,transparent 62%),
  linear-gradient(#714737,#301f1a)}
.arena-choice:nth-child(3){background:
  linear-gradient(125deg,transparent 34%,#ffb22e 35% 39%,transparent 40% 67%,#ff7b20 68% 72%,transparent 73%),
  radial-gradient(circle at 55% 80%,#d83b14,#6c1f16 54%,#271719 55%)}
.arena-choice:hover,.arena-choice:focus-visible{border-color:#f1c96c;outline:0;transform:translateY(-1px)}
#touch-pad{--touch-cell:clamp(10px,6.65vmin,46px);display:none;position:fixed;z-index:4;left:max(0px,env(safe-area-inset-left));bottom:max(clamp(3px,2vmin,14px),env(safe-area-inset-bottom));grid-template:repeat(3,var(--touch-cell))/repeat(3,var(--touch-cell));justify-content:center;gap:clamp(1px,.8vmin,5px);border-radius:clamp(3px,1.5vmin,10px);touch-action:none;cursor:grab;background:linear-gradient(90deg,transparent 31%,rgba(65,100,255,.28) 31% 69%,transparent 69%),linear-gradient(transparent 31%,rgba(65,100,255,.28) 31% 69%,transparent 69%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#touch-pad[hidden]{display:none}
#touch-pad::before{content:"";grid-area:2/2;width:53.333%;height:53.333%;place-self:center;border:clamp(.45px,.12vmin,1px) solid #6579dc;border-radius:50%;background:#253fc8;box-shadow:0 0 clamp(1px,.25vmin,1.5px) rgba(65,100,255,.75);pointer-events:none}
#touch-pad.dragging{cursor:grabbing}
#touch-pad.dragging::before{background:#ffd83d;border-color:#f5d7a1;box-shadow:0 0 clamp(1.5px,.35vmin,2.5px) rgba(255,216,61,.85)}
#touch-pad button{box-sizing:border-box;min-width:0;padding:0;border:0;border-radius:clamp(1px,1vmin,6px);background:#182252;color:#f8f5ec;font:700 clamp(3px,3vmin,20px)/1 ui-monospace,monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch-pad [data-dir="up left"]{grid-area:1/1}#touch-pad [data-dir=up]{grid-area:1/2}#touch-pad [data-dir="up right"]{grid-area:1/3}#touch-pad [data-dir=left]{grid-area:2/1}#touch-pad [data-dir=right]{grid-area:2/3}#touch-pad [data-dir="down left"]{grid-area:3/1}#touch-pad [data-dir=down]{grid-area:3/2}#touch-pad [data-dir="down right"]{grid-area:3/3}
@media (any-pointer:coarse),(hover:none){#touch-pad{display:grid}#touch-look{display:block}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="touch-look" hidden aria-label="Drag to look; tap to fire"></div>
<nav id="touch-pad" aria-label="Touch movement controls" hidden>
  <button type="button" class="touch-pad-button" data-dir="up left" aria-label="Move forward and left" aria-pressed="false">↖</button>
  <button type="button" class="touch-pad-button" data-dir="up" data-touch-key="w" aria-label="Move forward" aria-pressed="false">↑</button>
  <button type="button" class="touch-pad-button" data-dir="up right" aria-label="Move forward and right" aria-pressed="false">↗</button>
  <button type="button" class="touch-pad-button" data-dir="left" data-touch-key="a" aria-label="Move left" aria-pressed="false">←</button>
  <button type="button" class="touch-pad-button" data-dir="right" data-touch-key="d" aria-label="Move right" aria-pressed="false">→</button>
  <button type="button" class="touch-pad-button" data-dir="down left" aria-label="Move backward and left" aria-pressed="false">↙</button>
  <button type="button" class="touch-pad-button" data-dir="down" data-touch-key="s" aria-label="Move backward" aria-pressed="false">↓</button>
  <button type="button" class="touch-pad-button" data-dir="down right" aria-label="Move backward and right" aria-pressed="false">↘</button>
</nav>
<p id="status">Loading arena…</p>
<section id="arena-picker" aria-label="Choose an arena">
  <strong>Choose arena</strong>
  <div id="arena-choices">
    <button type="button" class="arena-choice" data-arena="oa_shine">Shine</button>
    <button type="button" class="arena-choice" data-arena="aggressor">Aggressor</button>
    <button type="button" class="arena-choice" data-arena="am_lavaarena">Lava Arena</button>
  </div>
</section>
<script type="module">
const canvas = document.getElementById("canvas");
const touchLook = document.getElementById("touch-look");
const status = document.getElementById("status");
const picker = document.getElementById("arena-picker");
const arenas = ["oa_shine", "aggressor", "am_lavaarena"];
let game = null;
let parentActive = true;
let paused = false;
const touchPad = document.getElementById("touch-pad");
let touchDrag = null;
let touchHeldKeys = [];
let touchRepeatTimer = 0;
const engineInputHandlers = { keydown:[], keyup:[], mousemove:[], mouseup:[] };
const touchDirectionKeys = { up:"w", left:"a", right:"d", down:"s" };
const touchReverse = { up:"down", down:"up", left:"right", right:"left" };

function emitTouchKey(type, key) {
  const upper = key.toUpperCase(), code = "Key" + upper, keyCode = upper.charCodeAt(0);
  const event = new KeyboardEvent(type, { key, code, bubbles:true, cancelable:true });
  try { Object.defineProperty(event, "keyCode", { value:keyCode }); } catch (_) {}
  try { Object.defineProperty(event, "which", { value:keyCode }); } catch (_) {}
  const handlers = engineInputHandlers[type];
  if (handlers && handlers.length) {
    handlers.forEach(entry => {
      try {
        if (typeof entry.listener === "function") entry.listener.call(entry.target, event);
        else if (entry.listener && entry.listener.handleEvent) entry.listener.handleEvent(event);
      } catch (error) { console.error(error); }
    });
  } else {
    document.dispatchEvent(event);
  }
}
function setTouchDirection(direction) {
  const keys = direction ? direction.split(" ").map(part => touchDirectionKeys[part]).filter(Boolean) : [];
  touchHeldKeys.filter(key => !keys.includes(key)).forEach(key => emitTouchKey("keyup", key));
  keys.filter(key => !touchHeldKeys.includes(key)).forEach(key => emitTouchKey("keydown", key));
  touchHeldKeys = keys;
  clearInterval(touchRepeatTimer);
  touchRepeatTimer = keys.length ? setInterval(() => {
    touchHeldKeys.forEach(key => emitTouchKey("keydown", key));
  }, 45) : 0;
  const buttons = touchPad ? touchPad.querySelectorAll("[data-dir]") : [];
  buttons.forEach(button => button.setAttribute("aria-pressed", button.getAttribute("data-dir") === direction ? "true" : "false"));
}
function releaseTouchKeys() {
  const pointerId = touchDrag && touchDrag.pointerId;
  touchDrag = null;
  if (touchPad) touchPad.classList.remove("dragging");
  setTouchDirection("");
  releaseTouchLook();
  if (pointerId != null && touchPad) { try { touchPad.releasePointerCapture(pointerId); } catch (_) {} }
}
if (touchPad) {
  function endTouchDrag(event) {
    if (!touchDrag || (event && event.pointerId !== touchDrag.pointerId)) return;
    if (event) { event.preventDefault(); event.stopPropagation(); }
    releaseTouchKeys();
  }
  touchPad.addEventListener("pointerdown", event => {
    if ((event.button !== undefined && event.button !== 0) || touchDrag) return;
    event.preventDefault(); event.stopPropagation();
    const button = event.target.closest?.("[data-dir]");
    const rect = touchPad.getBoundingClientRect();
    touchDrag = {
      pointerId:event.pointerId, x:event.clientX, y:event.clientY,
      lastDir:button ? button.getAttribute("data-dir") : null,
      threshold:Math.max(3, Math.min(7, Math.min(rect.width, rect.height) * .16))
    };
    touchPad.classList.add("dragging");
    try { touchPad.setPointerCapture(event.pointerId); } catch (_) {}
    if (touchDrag.lastDir) setTouchDirection(touchDrag.lastDir);
  });
  // Match Hack-Man's live direction pad: re-anchor after turns and require extra travel to reverse.
  touchPad.addEventListener("pointermove", event => {
    if (!touchDrag || event.pointerId !== touchDrag.pointerId) return;
    event.preventDefault(); event.stopPropagation();
    const dx = event.clientX - touchDrag.x, dy = event.clientY - touchDrag.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < touchDrag.threshold) return;
    const diagonal = ax >= touchDrag.threshold && ay >= touchDrag.threshold && Math.max(ax, ay) < Math.min(ax, ay) * 1.8;
    const direction = diagonal ? `${dy > 0 ? "down" : "up"} ${dx > 0 ? "right" : "left"}` : ax > ay ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    const needed = touchDrag.lastDir && touchReverse[touchDrag.lastDir] === direction ? touchDrag.threshold * 1.55 : touchDrag.threshold;
    if (Math.max(ax, ay) < needed) return;
    touchDrag.x = event.clientX; touchDrag.y = event.clientY;
    if (direction === touchDrag.lastDir) return;
    touchDrag.lastDir = direction;
    setTouchDirection(direction);
  });
  touchPad.addEventListener("pointerup", endTouchDrag);
  touchPad.addEventListener("pointercancel", endTouchDrag);
  touchPad.addEventListener("lostpointercapture", endTouchDrag);
  touchPad.addEventListener("click", event => event.preventDefault());
  ["contextmenu", "selectstart", "dragstart"].forEach(type => {
    touchPad.addEventListener(type, event => { event.preventDefault(); event.stopPropagation(); });
  });
}

function chooseArena() {
  return new Promise(resolve => {
    let picked = false;
    function pick(arena) {
      if (picked) return;
      picked = true;
      picker.hidden = true;
      try { localStorage.setItem("loft:q3-arena", arena); } catch (_) {}
      resolve(arena);
    }
    picker.addEventListener("click", event => {
      const button = event.target.closest("[data-arena]");
      if (button) pick(button.dataset.arena);
    });
    addEventListener("keydown", event => {
      if (picker.hidden || !/^[123]$/.test(event.key)) return;
      event.preventDefault();
      pick(arenas[Number(event.key) - 1]);
    });
  });
}

function tell(state) {
  try { parent.postMessage({ kind: "shoot-status", game: "q3", state }, location.origin); } catch (_) {}
}
function setStatus(text, isError) {
  status.textContent = text || "";
  status.className = isError ? "err" : "";
}
function audioContext() {
  return game && game.SDL2 && game.SDL2.audioContext;
}
function shouldRun() {
  return parentActive && !document.hidden;
}
function sync() {
  if (!game) return;
  const run = shouldRun();
  if (run && paused) {
    try { game.resumeMainLoop(); } catch (_) {}
    paused = false;
  } else if (!run && !paused) {
    try { game.pauseMainLoop(); } catch (_) {}
    paused = true;
  }
  const ctx = audioContext();
  if (ctx) {
    try { run ? ctx.resume() : ctx.suspend(); } catch (_) {}
  }
}

addEventListener("message", event => {
  if (event.origin !== location.origin || !event.data || event.data.kind !== "shoot-control") return;
  parentActive = !!event.data.active;
  if (!parentActive) releaseTouchKeys();
  sync();
});
addEventListener("focus", sync);
addEventListener("blur", sync);
addEventListener("blur", releaseTouchKeys);
document.addEventListener("visibilitychange", sync);
canvas.addEventListener("pointerdown", () => {
  try { window.focus(); } catch (_) {}
  try { canvas.focus({ preventScroll: true }); } catch (_) {}
  sync();
});
let touchAim = null;
let touchLookKeys = [];
const touchLookKeyMap = { left:"j", right:"l", up:"i", down:"k" };
function setTouchLookKeys(directions) {
  const next = directions.map(direction => touchLookKeyMap[direction]);
  touchLookKeys.filter(key => !next.includes(key)).forEach(key => emitTouchKey("keyup", key));
  next.filter(key => !touchLookKeys.includes(key)).forEach(key => emitTouchKey("keydown", key));
  touchLookKeys = next;
}
function releaseTouchLook() {
  touchLookKeys.forEach(key => emitTouchKey("keyup", key));
  touchLookKeys = [];
}
function releaseTouchFire() {
  const event = new MouseEvent("mouseup", { bubbles:true, button:0, buttons:0 });
  const handlers = engineInputHandlers.mouseup;
  if (handlers.length) handlers.forEach(entry => {
    try {
      if (typeof entry.listener === "function") entry.listener.call(entry.target, event);
      else if (entry.listener && entry.listener.handleEvent) entry.listener.handleEvent(event);
    } catch (error) { console.error(error); }
  });
  else canvas.dispatchEvent(event);
}
window.addEventListener("pointerdown", event => {
  if (event.pointerType !== "touch" || (event.target !== touchLook && event.target !== canvas) || touchAim) return;
  event.preventDefault(); event.stopImmediatePropagation();
  releaseTouchFire();
  touchAim = { id:event.pointerId, x:event.clientX, y:event.clientY, sx:event.clientX, sy:event.clientY, moved:false };
  try { touchLook.setPointerCapture(event.pointerId); } catch (_) {}
}, true);
window.addEventListener("pointermove", event => {
  if (!touchAim || event.pointerId !== touchAim.id) return;
  event.preventDefault(); event.stopImmediatePropagation();
  const dx = event.clientX - touchAim.x, dy = event.clientY - touchAim.y;
  if (Math.hypot(event.clientX - touchAim.sx, event.clientY - touchAim.sy) > 8) touchAim.moved = true;
  touchAim.x = event.clientX; touchAim.y = event.clientY;
  if (!dx && !dy) return;
  const mouseMove = new MouseEvent("mousemove", {
    bubbles:true, cancelable:true, clientX:event.clientX, clientY:event.clientY
  });
  try { Object.defineProperty(mouseMove, "movementX", { value:dx * 64 }); } catch (_) {}
  try { Object.defineProperty(mouseMove, "movementY", { value:dy * 64 }); } catch (_) {}
  const handlers = engineInputHandlers.mousemove;
  releaseTouchFire();
  if (handlers.length) handlers.forEach(entry => {
    try {
      if (typeof entry.listener === "function") entry.listener.call(entry.target, mouseMove);
      else if (entry.listener && entry.listener.handleEvent) entry.listener.handleEvent(mouseMove);
    } catch (error) { console.error(error); }
  });
  else canvas.dispatchEvent(mouseMove);
}, true);
function finishTouchAim(event) {
  if (!touchAim || event.pointerId !== touchAim.id) return;
  event.preventDefault(); event.stopImmediatePropagation();
  releaseTouchLook();
  if (!touchAim.moved) {
    canvas.dispatchEvent(new MouseEvent("mousedown", { bubbles:true, button:0, buttons:1 }));
    canvas.dispatchEvent(new MouseEvent("mouseup", { bubbles:true, button:0 }));
  }
  touchAim = null;
}
window.addEventListener("pointerup", finishTouchAim, true);
window.addEventListener("pointercancel", event => {
  if (!touchAim || event.pointerId !== touchAim.id) return;
  event.preventDefault(); event.stopImmediatePropagation();
  releaseTouchLook();
  touchAim = null;
}, true);
document.addEventListener("contextmenu", event => {
  event.preventDefault();
});
document.addEventListener("pointerlockchange", () => {
  if (!document.pointerLockElement) return;
  try { parent.postMessage({ kind: "shoot-pointer-lock", game: "q3" }, location.origin); } catch (_) {}
});
document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey) event.stopImmediatePropagation();
}, true);

try {
  const arena = await chooseArena();
  setStatus("Loading " + picker.querySelector('[data-arena="' + arena + '"]').textContent + "…");
  const nativeAddEventListener = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if ((type === "keydown" || type === "keyup" || type === "mousemove" || type === "mouseup") && listener &&
        (this === document || this === window || this === canvas)) {
      engineInputHandlers[type].push({ target:this, listener });
    }
    return nativeAddEventListener.call(this, type, listener, options);
  };
  const ioquake3 = (await import("./ioquake3.js")).default;
  const files = [
    { src: "baseoa/pak0.pk3", dst: "/baseoa" },
    { src: "baseoa/loft-shine.pk3", dst: "/baseoa" },
    { src: "baseoa/loft-arenas.pk3", dst: "/baseoa" }
  ];
  const fetches = files.map(file => fetch(file.src));
  game = await ioquake3({
    canvas,
    arguments: [
      "+set", "sv_pure", "0",
      "+set", "net_enabled", "0",
      "+set", "com_basegame", "baseoa",
      "+set", "cl_renderer", "opengl2",
      "+set", "r_preferOpenGLES", "1",
      "+set", "r_mode", "-1",
      "+set", "r_customwidth", "960",
      "+set", "r_customheight", "720",
      "+set", "r_fullscreen", "0",
      "+set", "r_hdr", "0",
      "+set", "r_postProcess", "0",
      "+set", "r_toneMap", "0",
      "+set", "r_autoExposure", "0",
      "+set", "r_normalMapping", "0",
      "+set", "r_specularMapping", "0",
      "+set", "r_deluxeMapping", "0",
      "+set", "sensitivity", "0.8",
      "+set", "cl_mouseAccel", "0",
      "+bind", "j", "+left",
      "+bind", "l", "+right",
      "+bind", "i", "+lookup",
      "+bind", "k", "+lookdown",
      "+set", "s_volume", "0.32",
      "+set", "musicvolume", "0.18",
      "+set", "g_gametype", "0",
      "+set", "fraglimit", "5",
      "+map", arena,
      "+addbot", "sarge", "3"
    ],
    locateFile: file => "./" + file,
    preRun: [async module => {
      module.addRunDependency("loft-openarena-files");
      try {
        for (let i = 0; i < files.length; i++) {
          const response = await fetches[i];
          if (!response.ok) throw new Error(files[i].src + ": HTTP " + response.status);
          module.FS.mkdirTree(files[i].dst);
          module.FS.writeFile(
            files[i].dst + "/" + files[i].src.split("/").pop(),
            new Uint8Array(await response.arrayBuffer())
          );
        }
      } finally {
        module.removeRunDependency("loft-openarena-files");
      }
    }]
  });
  setStatus("");
  touchPad.hidden = false;
  touchLook.hidden = false;
  tell("ready");
  sync();
  try { canvas.focus({ preventScroll: true }); } catch (_) {}
} catch (error) {
  console.error(error);
  setStatus("Arena offline.", true);
  tell("failed");
}
</script>
</body>
</html>
