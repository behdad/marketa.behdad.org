<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{width:1200px;height:630px;margin:0;overflow:hidden}
  body{display:grid;place-items:center;background:#f8f5ec;color:#453a31;font-family:"Fraunces",Georgia,serif}
  .card{position:relative;width:100%;height:100%;display:grid;place-items:center}
  .mark{position:absolute;top:112px;left:50%;width:150px;height:112px;transform:translateX(-50%)}
  .title{margin-top:114px;font-size:104px;font-weight:700;letter-spacing:-.035em;line-height:1}
  .rule{position:absolute;inset:auto 0 0;height:16px;background:linear-gradient(90deg,#d9a6a6 0 50%,#7f9ec0 50%)}
  .egg-mark{display:none}
  .loft-mark{display:none}
  body.egg .egg-mark,body.loft .loft-mark{display:block}
</style>
</head>
<body>
<main class="card">
  <svg class="mark egg-mark" viewBox="0 0 150 112">
    <path d="M52 49C37 21 43 5 53 5c12 0 17 20 18 43" fill="#fffdf8" stroke="#8e3a4a" stroke-width="6" stroke-linecap="round"/>
    <path d="M98 49c15-28 9-44-1-44-12 0-17 20-18 43" fill="#fffdf8" stroke="#4a6b94" stroke-width="6" stroke-linecap="round"/>
    <path d="M29 68c11-22 80-22 92 0l-13 31H42Z" fill="#fffdf8" stroke="#7d6e5d" stroke-width="6" stroke-linejoin="round"/>
    <path d="m37 69 15 10 14-14 13 14 16-14 17 13" fill="none" stroke="#7d6e5d" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="64" cy="63" r="4" fill="#453a31"/><circle cx="87" cy="63" r="4" fill="#453a31"/>
  </svg>
  <svg class="mark loft-mark" viewBox="0 0 150 112">
    <path d="M13 100V31L75 6l62 25v69Z" fill="#fffdf8" stroke="#7d6e5d" stroke-width="6" stroke-linejoin="round"/>
    <path d="M30 39h90v61H30Z" fill="#172332" stroke="#453a31" stroke-width="5"/>
    <path d="M60 39v61M90 39v61M30 70h90" stroke="#7f9ec0" stroke-width="4" opacity=".55"/>
    <path d="M34 49q41 26 82 0" fill="none" stroke="#d9a6a6" stroke-width="3"/>
    <circle cx="42" cy="54" r="5" fill="#f0cf6a"/><circle cx="58" cy="61" r="5" fill="#4a6b94"/>
    <circle cx="75" cy="64" r="5" fill="#8e3a4a"/><circle cx="92" cy="61" r="5" fill="#d9a6a6"/>
    <circle cx="108" cy="54" r="5" fill="#f0cf6a"/>
  </svg>
  <div class="title"></div>
  <div class="rule"></div>
</main>
<script>
  var loft = new URLSearchParams(location.search).get("card") === "loft";
  document.body.className = loft ? "loft" : "egg";
  document.querySelector(".title").textContent = loft ? "Loft Day" : "Egg Hunt";
</script>
</body>
</html>
