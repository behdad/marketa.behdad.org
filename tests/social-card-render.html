<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{width:1200px;height:630px;margin:0;overflow:hidden}
  body{background:#f8f5ec;color:#453a31;font-family:"Fraunces",Georgia,serif}
  .card{position:relative;width:1200px;height:630px;overflow:hidden}
  .egg-card,.loft-card,.hub-card{display:none}
  body.egg .egg-card,body.loft .loft-card,body.hub .hub-card{display:block}

  .hub-card{height:100%;background:
    radial-gradient(circle at 12% 4%,rgba(217,166,166,.18),transparent 29rem),
    radial-gradient(circle at 92% 34%,rgba(127,158,192,.14),transparent 27rem),
    linear-gradient(180deg,rgba(149,181,205,.16),rgba(149,181,205,.07) 300px,transparent 620px),
    #f8f5ec}
  .hub-savanna{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0 51%,#000 86%);mask-image:linear-gradient(to bottom,transparent 0 51%,#000 86%)}
  .hub-rainbow{position:absolute;left:50%;top:48px;width:470px;height:310px;transform:translateX(-50%);opacity:.28}
  .hub-rainbow path{fill:none;stroke-width:16;stroke-linecap:round}
  .hub-caps{position:absolute;left:50%;top:88px;width:100px;transform:translateX(-50%)}
  .hub-title{position:absolute;left:0;right:0;top:223px;font-size:88px;font-weight:500;letter-spacing:-.035em;line-height:1;text-align:center}
  .hub-title span{color:#8e3a4a}
  .hub-subtitle{position:absolute;left:0;right:0;top:357px;color:#716455;font-size:31px;font-weight:500;text-align:center}
  .hub-fishu{position:absolute;left:66px;top:110px;width:112px;filter:drop-shadow(0 3px 3px rgba(69,58,49,.12))}
  .hub-butterfly{position:absolute;right:78px;top:151px;width:92px;filter:drop-shadow(0 3px 3px rgba(69,58,49,.12))}
  .hub-geese{position:absolute;right:34px;top:21px;width:360px;opacity:.5}

  .egg-card{height:100%;background:linear-gradient(135deg,#f8f5ec 0%,#fffdf8 50%,#f2eadf 100%)}
  .egg-scene{position:absolute;top:34px;width:405px;height:548px;object-fit:cover;border:10px solid #fffdf8;border-radius:24px;background:#fffdf8;box-shadow:0 18px 38px rgba(69,58,49,.24)}
  .egg-scene.loft{left:154px;transform:rotate(-2.4deg)}
  .egg-scene.garden{right:154px;transform:rotate(2.4deg)}
  .egg-title{position:absolute;left:50%;bottom:37px;transform:translateX(-50%);min-width:430px;padding:15px 48px 20px;border:6px solid #e8dfcc;border-radius:999px;background:#fffdf8;box-shadow:0 12px 28px rgba(69,58,49,.24);font-size:78px;font-weight:700;letter-spacing:-.035em;line-height:1;text-align:center;white-space:nowrap}

  .loft-card{height:100%;background:#c07a55}
  .loft-world{position:absolute;left:-1310px;top:-250px;width:14000px;height:1400px;max-width:none}
  .loft-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,35,50,.72) 0%,rgba(23,35,50,.26) 32%,rgba(23,35,50,0) 58%,rgba(23,35,50,.16) 100%)}
  .loft-title{position:absolute;left:76px;top:70px;padding:21px 44px 29px;border:7px solid #d9a6a6;border-radius:28px;background:rgba(255,253,248,.94);box-shadow:0 16px 34px rgba(31,25,19,.32);font-size:91px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .loft-subtitle{position:absolute;left:83px;top:230px;max-width:330px;color:#fffdf8;font-size:31px;font-weight:500;line-height:1.18;text-shadow:0 2px 3px rgba(31,25,19,.72)}
  .rule{position:absolute;inset:auto 0 0;height:15px;background:linear-gradient(90deg,#d9a6a6 0 50%,#7f9ec0 50%)}
</style>
</head>
<body>
<main class="card hub-card">
  <img class="hub-savanna" src="../art/rsvp-savanna.webp" alt="">
  <svg class="hub-rainbow" viewBox="0 0 300 180" aria-hidden="true">
    <path d="M20 170 A130 130 0 0 1 280 170" stroke="#c68e95"/>
    <path d="M35 170 A115 115 0 0 1 265 170" stroke="#efb866"/>
    <path d="M50 170 A100 100 0 0 1 250 170" stroke="#e7d17d"/>
    <path d="M65 170 A85 85 0 0 1 235 170" stroke="#8fb596"/>
    <path d="M80 170 A70 70 0 0 1 220 170" stroke="#7f9ec0"/>
  </svg>
  <svg class="hub-fishu" viewBox="-35 -25 70 50" aria-hidden="true">
    <g fill="#6f9caa"><path d="M-3-13.5H3L0-20Z"/><path d="m8.5-11.8 5 2.6 1.5-8.8Z"/><path d="M16.5-3v6L24 0Z"/><path d="m13.5 9.2-5 2.6L15 18Z"/><path d="M-3 13.5H3L0 20Z"/><path d="m-8.5 11.8-5-2.6L-15 18Z"/><path d="m-13.5-9.2 5-2.6L-15-18Z"/></g>
    <path d="M-15-2q-9-7-11-4-3 7 0 11 2 5 11-1Z" fill="#9cc4d1" stroke="#5c8797"/>
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="#8bb3c2" stroke="#5c8797" stroke-width="1.5"/>
    <ellipse cx="2" cy="5.5" rx="12.5" ry="7.5" fill="#eef5ef" opacity=".9"/>
    <path d="M3 6q9 2 4 7-4-3-4-7Z" fill="#9cc4d1" stroke="#5c8797" stroke-width=".7"/>
    <circle cx="9" cy="-4" r="3.6" fill="#fffdf8"/><circle cx="9.9" cy="-3.4" r="2.1" fill="#453a31"/><circle cx="9" cy="-4.9" r=".85" fill="#fff"/>
    <path d="M14 1.6q2.6 2.6 5.2.2" fill="none" stroke="#4a6b74" stroke-linecap="round"/>
  </svg>
  <svg class="hub-butterfly" viewBox="0 0 80 70" aria-hidden="true">
    <path d="M38 35C21 4 3 8 8 29c4 17 17 18 31 11Z" fill="#d9a6a6" fill-opacity=".7" stroke="#8e3a4a" stroke-width="2"/>
    <path d="M42 35C59 4 77 8 72 29c-4 17-17 18-31 11Z" fill="#7f9ec0" fill-opacity=".7" stroke="#4a6b94" stroke-width="2"/>
    <path d="M40 29q-5 10 0 23 5-13 0-23Z" fill="#453a31"/><path d="M38 30q-7-10-11-12m15 12q7-10 11-12" fill="none" stroke="#453a31" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <svg class="hub-geese" viewBox="0 0 540 240" aria-hidden="true">
    <defs><g id="card-goose">
      <path d="m-23 5-19-3-13 6 28 8Z" fill="#413a35"/>
      <path d="M-29 4c4-13 19-19 37-15 15 3 23 12 19 22-7 13-31 16-50 6-6-3-9-8-6-13Z" fill="#8b765f" stroke="#4d443c" stroke-width="1.8"/>
      <path d="M-22 13c13 7 32 8 44 0-5 13-27 15-45 4Z" fill="#d0bea4" opacity=".92"/>
      <path d="M10-7c14-3 31-2 47 0 5-5 14-6 21-2 5 3 6 8 2 12-4 4-12 4-18 1-15-1-31 1-44 4Z" fill="#353330" stroke="#292725" stroke-width="1.7"/>
      <path d="M63-7c4-4 12-3 16 0-3 4-9 5-14 3Z" fill="#fffdf8"/><path d="m79-6 12 4-11 5Z" fill="#55483e"/><circle cx="77" cy="-8" r="1.2"/>
      <path d="M-20 2c-1-14 6-31 16-49 5 13 8 26 9 39 2-19 10-34 20-45 1 21-2 36-8 48Z" fill="#81715f" stroke="#4d443c" stroke-width="1.5"/>
      <path d="M-16-1c5-18 11-31 14-37M-7-4c6-18 12-30 19-38M2-4c7-17 14-28 20-35" fill="none" stroke="#b4a18a" stroke-width="1.4" opacity=".9"/>
    </g></defs>
    <use href="#card-goose" transform="translate(480 120) scale(.58 .42)"/><use href="#card-goose" transform="translate(391 94) rotate(-2) scale(.54 .39)"/>
    <use href="#card-goose" transform="translate(384 147) rotate(2) scale(.51 .36)"/><use href="#card-goose" transform="translate(301 75) rotate(-3) scale(.49 .35)"/>
    <use href="#card-goose" transform="translate(286 166) rotate(3) scale(.5 .36)"/><use href="#card-goose" transform="translate(207 57) rotate(-4) scale(.47 .34)"/>
    <use href="#card-goose" transform="translate(181 183) rotate(4) scale(.44 .31)"/><use href="#card-goose" transform="translate(103 46) rotate(-5) scale(.41 .29)"/>
  </svg>
  <img class="hub-caps" src="../art/caps.svg" alt="">
  <div class="hub-title">markéta <span>&amp;</span> behdad</div>
  <div class="hub-subtitle">Everything we’ve sent you lives here.</div>
  <div class="rule"></div>
</main>
<main class="card egg-card">
  <img class="egg-scene loft" src="../art/loft-scene.svg" alt="">
  <img class="egg-scene garden" src="../art/garden-scene.svg" alt="">
  <div class="egg-title">Egg Hunt</div>
  <div class="rule"></div>
</main>
<main class="card loft-card">
  <img class="loft-world" src="../art/loft-game-strip.svg" alt="">
  <div class="loft-shade"></div>
  <div class="loft-title">Loft Day</div>
  <div class="loft-subtitle">Espresso, rooms,<br>parties &amp; road trips.</div>
  <div class="rule"></div>
</main>
<script>
  var card = new URLSearchParams(location.search).get("card");
  document.body.className = card === "hub" ? "hub" : card === "loft" ? "loft" : "egg";
</script>
</body>
</html>
